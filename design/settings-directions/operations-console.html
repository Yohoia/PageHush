<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>运维状态台 · 页息设置</title><style>*{box-sizing:border-box}html,body{margin:0;min-height:100%}body{background#0e0e11;background:#0e0e11;color#f4f4f5;font-family:Inter,"DM Sans",-apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif}.page{width:min(760px,100%-48px);margin:auto;padding:32px 0 90px}header{height:72px;display:flex;justify-content:space-between;align-items:center}.brand{display:flex;align-items:center;gap:10px}.brand img:first-child{width:34px;height:34px}.brand img:last-child{height:34px;filter:invert(.88) sepia(.2) saturate(.8)}nav{display:flex;gap:6px;font-size:13px}nav span{height:34px;display:flex;align-items:center;padding:0 10px;border-radius:99px;color#a1a1aa;color:#a1a1aa}nav .active{background#f4f4f5;background:#f4f4f5;color#17171b;color:#17171b}h1{margin:24px 0 12px;font-family:DM Sans,Inter,sans-serif;font-size:38px;font-weight:500;animation:up .4s both}.summary{display:flex;justify-content:space-between;gap:12px;align-items:center;margin:0 0 16px;color#a1a1aa;color:#a1a1aa;font-size:12px;animation:up .45s .05s both}.summary strong{color#f4f4f5;color:#f4f4f5}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;animation:up .45s .1s both}.metric{border:1px solid#27272a;border:1px solid #27272a;border-radius:10px;background#17171b;background:#17171b;padding:14px;transition:.2s}.metric:hover{border-color#3f3f46;border-color:#3f3f46;transform:translateY(-2px)}.metric strong{display:block;font-family:DM Sans,Inter,sans-serif;font-size:21px}.metric span{display:block;margin-top:5px;color#a1a1aa;color:#a1a1aa;font-size:11px}.state{display:inline-flex;align-items:center;gap:6px;margin-top:10px;color#c9a227;color:#c9a227;font-size:11px}.state i{width:6px;height:6px;border-radius:50%;background#c9a227;background:#c9a227;animation:pulse 2.2s infinite}.section{margin-top:16px;border:1px solid#27272a;border:1px solid #27272a;border-radius:12px;background#17171b;background:#17171b;padding:17px;animation:up .48s both}.section:nth-of-type(2){animation-delay:.15s}.section:nth-of-type(3){animation-delay:.2s}.head{display:flex;justify-content:space-between;gap:12px;align-items:start}h2{margin:0;font-size:17px;font-weight:500}.sub{margin:6px 0 0;color#a1a1aa;color:#a1a1aa;font-size:11px;line-height:1.7}.button{height:31px;border:1px solid#3f3f46;border:1px solid #3f3f46;background:none;color#a1a1aa;color:#a1a1aa;border-radius:99px;padding:0 10px;font:inherit;font-size:11px;transition:.18s}.button:hover{color#fff;color:#fff;border-color#52525b;border-color:#52525b}.fields{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}label{display:grid;gap:5px;color#a1a1aa;color:#a1a1aa;font-size:10px}input,select{height:35px;border:1px solid#303034;border:1px solid #303034;background#0e0e11;background:#0e0e11;border-radius:7px;color inherit;color:inherit;padding:0 9px;font:inherit;font-size:12px;outline:0}input:focus,select:focus{border-color#7d8f70;border-color:#7d8f70;box-shadow:0 0 0 3px rgba(125,143,112,.15)}.pipeline{display:grid;gap:8px;margin-top:14px}.step{display:grid;grid-template-columns:20px minmax(0,1fr) auto;gap:9px;align-items:center;padding:10px;border:1px solid#27272a;border:1px solid #27272a;border-radius:8px;background#0e0e11;background:#0e0e11;transition:.18s}.step:hover{border-color#3f3f46;border-color:#3f3f46}.step i{width:7px;height:7px;border-radius:50%;background#52525b}.step.pending i{background#c9a227;animation:pulse 2.2s infinite}.step strong{font-size:12px}.step span{display:block;margin-top:3px;color#a1a1aa;color:#a1a1aa;font-size:10px}.step small{color#a1a1aa;color:#a1a1aa;font-size:10px}.footer{display:flex;justify-content:space-between;gap:10px;margin-top:13px;color#a1a1aa;color:#a1a1aa;font-size:10px}.primary{background#f4f4f5;background:#f4f4f5;color#17171b;color:#17171b;border-color#f4f4f5;border-color:#f4f4f5}@media(max-width:700px){.page{width:calc(100% - 28px)}.grid,.fields{grid-template-columns:1fr}.step{grid-template-columns:1fr}.step small{justify-self:start}}@keyframes up{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}@keyframes pulse{50%{opacity:.4}}@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.metric:hover,.step:hover{transform:none}}
</style></head><body><header><a class="brand" href="#"><img src="img/logo.png" alt=""><img src="img/chinese-logo.png" alt="页息"></a><nav><span>文稿</span><span>写作</span><span class="active">设置</span></nav></header><main class="page"><h1>系统设置</h1><p class="summary"><span>当前分类：<strong>随笔</strong></span><span>4 项待连接</span></p><section class="grid"><div class="metric"><strong>PostgreSQL</strong><span>服务器实例 · 待验证</span><em class="state"><i></i>未连接</em></div><div class="metric"><strong>MinIO</strong><span>pagehush-assets · 待验证</span><em class="state"><i></i>未连接</em></div><div class="metric"><strong>Astro</strong><span>博客源码版本待绑定</span><em class="state"><i></i>待配置</em></div><div class="metric"><strong>备份</strong><span>独立副本未启用</span><em class="state"><i></i>待设计</em></div></section><section class="section"><div class="head"><div><h2>当前分类</h2><p class="sub">分类影响首页筛选、文章默认资料和 blog topic 映射。</p></div><button class="button">切换分类</button></div><div class="fields"><label>名称<input value="随笔"></label><label>topic<input value="Essay"></label><label>默认语言<select><option>简体中文</option><option>English</option></select></label><label>默认标签<input value="写作"></label></div><div class="footer"><span>8 篇引用 · 2 篇有未发布修改</span><button class="button primary">保存</button></div></section><section class="section"><div class="head"><div><h2>发布链路</h2><p class="sub">固定内容包、Astro 构建、Nginx 切换与回滚必须串行确认。</p></div><button class="button">诊断</button></div><div class="pipeline"><div class="step pending"><i></i><div><strong>文章内容包</strong><span>生成不可变快照</span></div><small>待接入</small></div><div class="step"><i></i><div><strong>Astro 构建</strong><span>隔离工作区执行 MDX</span></div><small>待配置</small></div><div class="step"><i></i><div><strong>Nginx 切换</strong><span>仅构建成功后生效</span></div><small>待部署</small></div><div class="step"><i></i><div><strong>回滚</strong><span>保留上一线上版本</span></div><small>待设计</small></div></div></section></main></body></html>
