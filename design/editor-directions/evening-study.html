</style></head><body><div class="app"><header><a class="brand" href="#"><img src="img/logo.png" alt=""><img src="img/chinese-logo.png" alt="页息"></a><nav class="tools"><button>文稿</button><button class="quiet">导出</button><button class="primary">＋ 新建</button><span class="status"><i></i>夜读草稿</span></nav></header><main><div class="meta"><strong>随笔</strong><span>482 字 · 15:20</span></div><h1 contenteditable="true" spellcheck="false">把日子，写慢一点</h1><div class="rule"></div><article class="article" contenteditable="true" spellcheck="false"><p>午后的光落在桌面上，杯里的茶已经凉了。我关掉几个不停闪动的窗口，打开一张空白的纸。</p><p>有时候，写作不为抵达哪里。只是想把匆忙经过的日子，重新过一遍。</p><h2>从一件小事开始</h2><blockquote>那些没有被记下来的瞬间，并不是没有发生。只是我们走得太快。</blockquote><ul><li>记下一个今天看到的细节</li><li>写一句还没有答案的话</li><li>允许这一页暂时没有结尾</li></ul></article></main><div class="dock" aria-label="编辑工具"><button>H</button><button>B</button><button>❝</button><button>≡</button><button>∑</button><button>⌗</button></div></div></body></html>
