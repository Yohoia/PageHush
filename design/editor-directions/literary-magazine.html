<section class="main"><aside class="margin-note">随笔<br>10 月 6 日<br>482 字<br>第 01 篇</aside><p class="kicker">ESSAY · 随笔</p><h1 contenteditable="true" spellcheck="false">把日子，<br>写慢一点</h1><p class="standfirst">关掉几个不停闪动的窗口，重新看见桌面上的一杯茶、一段光，和一张还没有写满的纸。</p><article class="article" contenteditable="true" spellcheck="false"><p class="open">午后的光落在桌面上，杯里的茶已经凉了。我关掉几个不停闪动的窗口，打开一张空白的纸。</p><p>有时候，写作不为抵达哪里。只是想把匆忙经过的日子，重新过一遍。</p><h2>从一件小事开始</h2><blockquote>那些没有被记下来的瞬间，并不是没有发生。只是我们走得太快。</blockquote><ul><li>记下一个今天看到的细节</li><li>写一句还没有答案的话</li><li>允许这一页暂时没有结尾</li></ul></article></section><div class="dock" aria-label="编辑工具"><button>H</button><button>B</button><button>❝</button><button>≡</button><button>∑</button><button>⌗</button></div><span class="page">PAGEHUSH · 01</span></main></body></html>
