<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>素纸长卷 · 页息编辑器</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:#f8f7f2;color:#22231f;font-family:"Noto Serif SC","Source Han Serif SC","Songti SC",serif;position:relative;min-height:100vh}
body::before{content:"";position:fixed;inset:0;background-image:radial-gradient(rgba(34,35,31,.05) .5px,transparent .5px),linear-gradient(90deg,rgba(34,35,31,.018) .5px,transparent .5px);background-size:22px 22px,88px 88px;opacity:.65;pointer-events:none}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
.app{min-height:100vh;display:flex;flex-direction:column;position:relative}
.mast{height:88px;flex-shrink:0;display:flex;align-items:center;justify-content:space-between;gap:28px;margin:0 56px;border-bottom:1px solid #ddded4}
.brand{display:flex;align-items:center;gap:13px;text-decoration:none;color:inherit}
.brand img:first-child{width:38px;height:38px}
.brand img:last-child{height:38px;width:auto}
.tools{display:flex;align-items:center;gap:9px;font-family:"Inter","IBM Plex Sans SC","PingFang SC",sans-serif;font-size:13px;color:#72746d}
.tools button{min-height:36px;padding:0 11px;border-radius:3px;transition:.18s}
.tools button:hover{background:#eeeee6;color:#22231f}
.tools .primary{background:#22231f;color:#f8f7f2}
.status{display:flex;align-items:center;gap:7px;min-height:36px;padding:0 11px;border:1px solid #ddded4;border-radius:3px}
.dot{width:6px;height:6px;border-radius:50%;background:#a94d38}
.stage{flex:1;width:min(720px,calc(100% - 48px));margin:0 auto;padding:72px 0 142px;position:relative}
.folio{position:absolute;left:-74px;top:5px;width:34px;padding-top:11px;border-top:1px solid #22231f;color:#72746d;font:12px/1.6 "IBM Plex Mono",Menlo,monospace;text-align:right}
.meta{display:flex;justify-content:space-between;gap:20px;margin-bottom:25px;font:12px/1.5 "Inter","IBM Plex Sans SC",sans-serif;color:#72746d}
.meta strong{color:#22231f;font-weight:500;letter-spacing:.12em}
h1{margin:0 0 31px;font-size:48px;line-height:1.22;font-weight:500;letter-spacing:-.015em;outline:none}
.rule{width:38px;height:1px;background:#22231f;margin:0 0 33px}
.article{font-size:19px;line-height:1.95;letter-spacing:.01em;outline:none}
.article p{margin:0 0 1em}
.article p.active{background:#ecebe1;box-shadow:0 0 0 6px #ecebe1}
.article h2{font-size:30px;line-height:1.35;font-weight:500;margin:56px 0 20px}
.article blockquote{margin:0 0 1em;padding-left:21px;border-left:2px solid #22231f;color:#61665a;font-size:20px;line-height:1.8;font-style:normal}
.article ul{margin:0 0 1em;padding-left:27px;list-style:none}
.article li{position:relative;margin:8px 0}
.article li::before{content:"—";position:absolute;left:-27px;color:#a1a39a}
.toolbar{position:fixed;left:50%;bottom:32px;transform:translateX(-50%);display:flex;align-items:center;gap:4px;padding:7px;border:1px solid #d9dacf;border-radius:99px;background:rgba(255,254,249,.94);box-shadow:0 12px 34px rgba(34,35,31,.08);font:13px/1 "Inter","IBM Plex Sans SC",sans-serif;color:#72746d}
.toolbar button{min-width:35px;height:35px;border-radius:99px}
.toolbar button:hover{background:#eeeee6;color:#22231f}
.toolbar span{width:1px;height:17px;margin:0 5px;background:#ddded4}
.kbd{margin-left:6px;font:10px/1 "IBM Plex Mono",monospace;color:#a1a39a}
@media(max-width:780px){.mast{height:74px;margin:0 23px;gap:12px}.brand img:first-child{width:33px;height:33px}.brand img:last-child{height:33px}.tools .quiet{display:none}.stage{padding:45px 0 125px}.folio{display:none}h1{font-size:38px}.article{font-size:18px}.toolbar{bottom:20px}}
</style>
</head>
<body>
<main class="app">
<header class="mast">
<a class="brand" href="#"><img src="img/logo.png" alt=""><img src="img/chinese-logo.png" alt="页息"></a>
<nav class="tools"><button>所有文稿</button><button class="quiet">导出</button><button class="primary">＋ 新建</button><span class="status"><i class="dot"></i>草稿</span></nav>
</header>
<section class="stage">
<div class="folio">01</div>
<div class="meta"><strong>随笔</strong><span>482 字 · 最近编辑 15:20</span></div>
<h1 contenteditable="true" spellcheck="false">把日子，写慢一点</h1>
<div class="rule"></div>
<article class="article" contenteditable="true" spellcheck="false">
<p class="active">午后的光落在桌面上，杯里的茶已经凉了。我关掉几个不停闪动的窗口，打开一张空白的纸。</p>
<p>有时候，写作不为抵达哪里。只是想把匆忙经过的日子，重新过一遍。</p>
<h2>从一件小事开始</h2>
<blockquote>那些没有被记下来的瞬间，并不是没有发生。只是我们走得太快。</blockquote>
<ul><li>记下一个今天看到的细节</li><li>写一句还没有答案的话</li><li>允许这一页暂时没有结尾</li></ul>
</article>
</section>
<div class="toolbar" aria-label="编辑工具"><button title="标题">H</button><button title="粗体">B</button><button title="引用">❝</button><button title="列表">≡</button><span></span><button title="公式">∑</button><button title="代码">⌗</button><span></span><button title="专注模式">◎<i class="kbd">⌘⇧F</i></button></div>
</main>
</body>
</html>
