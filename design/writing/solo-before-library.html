<div class="source-wrap" x-show="mode==='write'"><textarea class="native-source" x-ref="source" aria-label="Markdown 正文" spellcheck="false">午后的光落在桌面上，杯里的茶已经凉了。我关掉几个不停闪动的窗口，打开一张空白的纸。

有时候，写作不为抵达哪里。只是想把匆忙经过的日子，重新过一遍。

## 从一件小事开始

今天路过巷口的花店，店主正在给一枝快要开败的花换水。她没有急着把它丢掉，而是剪去枯掉的叶子，重新放回窗边。

我站了一会儿，忽然觉得，**留意也是一种照顾。**

> 那些没有被记下来的瞬间，并不是没有发生。只是我们走得太快。</textarea><div class="empty-hint" x-cloak x-show="!note.body.length">从一句话开始。</div></div><div class="prose" x-cloak x-show="mode==='preview'" x-html="render(note.body)"></div></article></div>

</main><script>
let writingEditor, saveTimer, toastTimer, syncing=false, stored=false;
const INITIAL_NOTES=[{"title": "把日子，写慢一点", "group": "随笔", "date": "10 月 6 日", "body": "午后的光落在桌面上，杯里的茶已经凉了。我关掉几个不停闪动的窗口，打开一张空白的纸。\n\n有时候，写作不为抵达哪里。只是想把匆忙经过的日子，重新过一遍。\n\n## 从一件小事开始\n\n今天路过巷口的花店，店主正在给一枝快要开败的花换水。她没有急着把它丢掉，而是剪去枯掉的叶子，重新放回窗边。\n\n我站了一会儿，忽然觉得，**留意也是一种照顾。**\n\n> 那些没有被记下来的瞬间，并不是没有发生。只是我们走得太快。\n\n## 给念头留一点空白\n\n以前总想一口气写完一篇文章。现在学着停下来，给还没成形的念头留一个位置。不必急着解释，也不必立刻找到结尾。\n\n- 记下一个今天看到的细节\n- 写一句还没有答案的话\n- 允许这一页暂时没有结尾\n\n## 写给明天的自己\n\n如果明天再打开这篇笔记，希望还能记起今天的光，和那枝被留下来的花。"}, {"title": "雨停之后的街道", "group": "随笔", "date": "10 月 4 日", "body": "雨停之后，街道比下雨的时候更安静。路面留下了树的影子，偶尔有自行车从水洼旁边绕过。\n\n## 散步的理由\n\n我没有特别想去的地方，只是决定晚一点回家。沿着熟悉的路走，看到的却是一些平时没有留意的细节。\n\n> 同一条街道，每次走过都是不同的一天。\n\n## 留下来的声音\n\n屋檐上还在滴水。那声音很轻，但走远以后，我还是能听见。"}, {"title": "关于一间旧书店", "group": "随笔", "date": "9 月 28 日", "body": "书店在二楼，门口的木牌已经褪色。推开门时，铃铛响了一声。\n\n## 柜台后的人\n\n老板正在给一本旧书包封面，没有抬头。他说可以慢慢看，下午没有什么人。\n\n## 一页折角\n\n我翻开一本散文集，发现其中一页折了角。那一页写着海，我想象之前的读者，在某个下午读到了同样的句子。"}, {"title": "散步时想到的", "group": "灵感", "date": "9 月 25 日", "body": "## 尚未写成的句子\n\n- 一扇亮着灯的窗，像一句没有说完的话。\n- 走得慢的时候，路会变长，日子也是。\n- 一本书的最后一页，不一定是故事的结尾。"}];
const STORAGE='pagehush-writer-v2';
document.addEventListener('alpine:init',()=>Alpine.data('pageHushWriter',()=>({
 notes:JSON.parse(JSON.stringify(INITIAL_NOTES)),id:0,mode:'write',focus:false,library:false,query:'',status:'草稿',toast:'',
 init(){

   if(saved&&Array.isArray(saved.notes)&&saved.notes.length&&saved.notes.every(n=>n&&typeof n.title==='string'&&typeof n.body==='string'&&typeof n.group==='string'&&typeof n.date==='string')){this.notes=saved.notes;this.id=Math.max(0,Math.min(Number(saved.id)||0,saved.notes.length-1));this.status='已保存';stored=true;}
  }catch(e){this.status='恢复失败，草稿已保留';}
  const state=new URLSearchParams(location.search).get('state');

  if(state==='preview')this.mode='preview';
  if(state==='empty'){this.notes=[{title:'未命名文稿',body:'',group:'随笔',date:'10 月 6 日'}];this.id=0;this.status='草稿';stored=false;}
  if(state==='long-title')this.notes[0].title='把日子写慢一点，也给那些没有说出口的话留一个位置';
  if(state==='error')this.status='保存失败，草稿已保留';
  this.$nextTick(()=>{this.mountEditor();this.sizeTitle(this.$refs.title);if(state==='library')this.openLibrary();});
  window.addEventListener('resize',()=>this.sizeTitle(this.$refs.title));
  window.addEventListener('pagehide',()=>{if(saveTimer)this.save();});
 },
 get note(){return this.notes[this.id];},

  writingEditor=CodeMirror.fromTextArea(this.$refs.source,{mode:{name:'markdown',highlightFormatting:true,taskLists:true,strikethrough:true},lineWrapping:true,viewportMargin:Infinity,inputStyle:'contenteditable',spellcheck:false,indentUnit:2,tabSize:2,extraKeys:{'Cmd-S':()=>this.save(),'Ctrl-S':()=>this.save(),'Cmd-B':()=>this.wrap('**'),'Ctrl-B':()=>this.wrap('**'),'Cmd-I':()=>this.wrap('*'),'Ctrl-I':()=>this.wrap('*'),'Cmd-Shift-F':()=>{this.focus=!this.focus},'Ctrl-Shift-F':()=>{this.focus=!this.focus}},dragDrop:false});
  this.$refs.source.removeAttribute('aria-label');

 },

  if(saveTimer)this.save();const position=writingEditor?.getCursor();if(position)this.note.cursor=position;this.note.scroll=this.$refs.scroll.scrollTop;
  this.id=i;this.status=stored?'已保存':'草稿';syncing=true;writingEditor.setValue(this.note.body);writingEditor.setCursor(this.note.cursor||{line:0,ch:0});writingEditor.clearHistory();syncing=false;
  this.$nextTick(()=>{this.sizeTitle(this.$refs.title);writingEditor.refresh();this.$refs.scroll.scrollTop=this.note.scroll||0;});
 },
 changeMode(m){
  const s=this.$refs.scroll;const ratio=s.scrollTop/Math.max(1,s.scrollHeight-s.clientHeight);this.mode=m;
  this.$nextTick(()=>{if(m==='write')writingEditor.refresh();s.scrollTop=ratio*Math.max(0,s.scrollHeight-s.clientHeight);});
 },
 openLibrary(){if(this.library){this.closeLibrary();return;}this.library=true;this.$nextTick(()=>this.$refs.search.focus());},
 closeLibrary(restore=true){if(!this.library)return;this.library=false;if(restore)this.$nextTick(()=>this.$refs.libraryButton.focus());},
 trapFocus(event){const elements=Array.from(event.currentTarget.querySelectorAll('button,input')).filter(el=>el.getClientRects().length);const first=elements[0],last=elements[elements.length-1];if(event.shiftKey&&document.activeElement===first){event.preventDefault();last.focus();}else if(!event.shiftKey&&document.activeElement===last){event.preventDefault();first.focus();}},
 newNote(){if(saveTimer)this.save();this.notes.push({title:'未命名文稿',body:'',group:'随笔',date:'10 月 6 日'});this.select(this.notes.length-1);this.query='';this.mode='write';this.changed();this.$nextTick(()=>{writingEditor.refresh();this.$refs.title.focus();this.$refs.title.select();});},
 wrap(mark){const selected=writingEditor.getSelection();writingEditor.replaceSelection(mark+selected+mark,'around');if(!selected){const p=writingEditor.getCursor('from');writingEditor.setCursor({line:p.line,ch:p.ch+mark.length});}writingEditor.focus();},
 render(body){return DOMPurify.sanitize(marked.parse(body,{gfm:true,breaks:false}),{FORBID_TAGS:['style','iframe','object','embed'],FORBID_ATTR:['style']});},
 exportNote(){const blob=new Blob(['# '+this.note.title+'\n\n'+this.note.body+'\n'],{type:'text/markdown;charset=utf-8'});const url=URL.createObjectURL(blob);const link=document.createElement('a');link.href=url;link.download=(this.note.title.trim()||'未命名文稿').replace(/[\\/:*?"<>|]/g,'-')+'.md';link.style.display='none';document.body.appendChild(link);link.click();link.remove();setTimeout(()=>URL.revokeObjectURL(url),60000);this.toast='已生成 Markdown 文件';clearTimeout(toastTimer);toastTimer=setTimeout(()=>this.toast='',4500);}
})));</script></body></html>
