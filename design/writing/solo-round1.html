<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="icon" href="solo-favicon.svg"><title>独页 · 写作</title><style>
:root{--bg:#242329;--surface:#2d2c34;--ink:#dedce1;--quiet:#9d9aa7;--line:#403e49;--accent:#bcb0d3;--selected:#38333f;--mono:"SFMono-Regular","Menlo","PingFang SC",monospace;--sans:"PingFang SC",sans-serif;--column:690px;--radius:4px;--space:28px;--ease:cubic-bezier(.22,.7,.26,1)}*{box-sizing:border-box}html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:var(--sans)}[x-cloak]{display:none!important}button,input,textarea{font:inherit;color:inherit}button{border:0;background:transparent;cursor:pointer;min-height:34px;border-radius:var(--radius);transition:background 180ms,transform 100ms,color 180ms}button:hover{background:var(--surface);color:#fff}button:active{transform:scale(.97)}button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:5px}::selection{background:#51465f}.app{height:100dvh;display:flex;flex-direction:column;position:relative}.mast{height:82px;flex-shrink:0;display:flex;justify-content:space-between;align-items:center;margin:0 48px;border-bottom:1px solid var(--line);font-size:12px;gap:24px}.wordmark{font-size:19px;font-weight:500;letter-spacing:6px;display:flex;align-items:center;gap:18px}.wordmark span{font:14px var(--mono);letter-spacing:-2px;color:var(--accent)}.top-tools{display:flex;align-items:center;gap:24px;color:var(--quiet)}.open-library{padding:0 5px;display:flex;gap:14px;align-items:center}.open-library span{font:12px var(--mono);color:var(--quiet)}.top-tools .focus-toggle{font-size:12px}.header-left{display:flex;gap:55px;align-items:center}.scroll{flex:1;overflow:auto;min-height:0}.sheet{max-width:var(--column);margin:75px auto 90px;position:relative;padding:0 24px;animation:ink-in 450ms var(--ease)}.eyebrow{display:flex;justify-content:space-between;align-items:center;color:var(--quiet);font:12px var(--mono);margin-bottom:28px}.eyebrow b{color:var(--accent);font-weight:400}.title{background:none;border:0;outline:none;width:100%;padding:0;font:500 32px/1.5 var(--mono);letter-spacing:0;margin-bottom:37px}.writing-line{height:1px;background:var(--line);margin-bottom:31px;width:40px}.source-wrap{position:relative}.gutter{position:absolute;right:calc(100% + 34px);top:0;font:11px/40px var(--mono);color:#6f6c7a;text-align:right}.source{width:100%;padding:0;resize:none;background:none;border:0;outline:none;font:18px/2.15 var(--mono);caret-color:var(--accent);min-height:870px}.preview{font:18px/2.15 var(--mono);min-height:700px}.preview p{margin:0 0 24px}.preview h2{color:var(--accent);font:500 20px/1.6 var(--mono);margin:36px 0 20px}.preview blockquote{margin:24px 0;color:var(--quiet);padding-left:22px}.preview ul{padding-left:23px}.dock{height:74px;flex-shrink:0;display:flex;justify-content:space-between;align-items:center;gap:20px;margin:0 48px;border-top:1px solid var(--line);font:11px var(--mono);color:var(--quiet)}.dock-left,.dock-right{display:flex;gap:24px;align-items:center}.mode-control{display:flex;background:#1c1b20;padding:3px;border-radius:6px;position:relative}.mode-control button{position:relative;z-index:1;padding:0 17px;min-height:30px;font:12px var(--sans);color:var(--quiet)}.mode-control button.active{color:var(--ink)}.mode-slider{position:absolute;top:3px;bottom:3px;left:3px;width:58px;background:#39343f;border-radius:4px;transition:transform 200ms var(--ease)}.goal{display:flex;align-items:center;gap:12px}.goal-meter{display:flex;gap:3px}.goal-meter i{width:3px;height:10px;background:var(--line);transition:background 200ms}.goal-meter i.lit{background:#a599ba}.save-status{color:var(--accent)}.focus .mast{border-color:transparent}.focus .header-left>.open-library,.focus .wordmark,.focus .dock-left>span,.focus .goal{opacity:0;pointer-events:none;transition:opacity 220ms}.focus .sheet{margin-top:65px}.drawer{position:absolute;top:71px;left:162px;width:340px;background:var(--surface);border:1px solid var(--line);z-index:20;box-shadow:0 12px 40px #0004;padding:20px;border-radius:6px;transform-origin:top left}.drawer-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:15px;font-size:13px}.drawer-head small{color:var(--quiet);font-size:11px}.drawer input{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:4px;padding:10px 12px;outline:none;margin-bottom:13px;font-size:13px}.drawer button.note{display:flex;justify-content:space-between;align-items:center;gap:12px;width:100%;padding:12px;text-align:left;font-size:13px}.note.selected{background:var(--selected);color:var(--accent)}.note small{font-size:11px;color:var(--quiet);white-space:nowrap}.drawer .add-note{width:100%;padding:12px;text-align:left;border-top:1px solid var(--line);margin-top:10px;color:var(--accent);font-size:12px}.empty{padding:14px;color:var(--quiet);font-size:13px}@keyframes ink-in{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}.tip{position:absolute;left:52px;bottom:105px;writing-mode:vertical-rl;letter-spacing:3px;color:#77717f;font:11px var(--sans);letter-spacing:3px}
@media(max-width:1000px){.gutter{display:none}.tip{display:none}.sheet{max-width:660px}.header-left{gap:32px}}
@media(max-width:650px){.mast{height:65px;margin:0 22px;gap:10px}.wordmark{font-size:17px;letter-spacing:3px;gap:8px}.wordmark span{display:none}.header-left{gap:12px}.top-tools{gap:7px}.top-tools button{min-height:44px;padding:0 6px}.open-library{min-height:44px;font-size:12px}.open-library span{display:none}.sheet{margin:42px auto 55px;padding:0 28px}.title{font-size:27px;margin-bottom:28px}.source{font-size:17px;line-height:2.05;min-height:1250px}.eyebrow{font-size:11px;margin-bottom:23px}.dock{margin:0 20px;height:72px;gap:8px}.dock-left{gap:12px}.dock-left>span{font-size:10px}.dock-right{gap:9px}.goal{display:none}.save-status{font-size:10px}.mode-control button{min-height:40px;padding:0 17px}.drawer{left:20px;right:20px;top:60px;width:auto}.drawer input{font-size:16px}.drawer button.note{min-height:48px}.focus .sheet{margin-top:42px}.preview{font-size:17px}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style><script defer src="vendor/alpine.min.js"></script></head><body>
<main class="app" x-data="soloWriter" :class="{'focus':focus}" @keydown.escape.window="library=false;focus=false" @keydown.meta.s.window.prevent="save()" @keydown.ctrl.s.window.prevent="save()">
<header class="mast"><div class="header-left"><div class="wordmark"><span>[ ]</span>独页</div><button class="open-library" @click="library=!library" :aria-expanded="library">我的笔记 <span x-text="String(id+1).padStart(2,'0')+' / '+String(notes.length).padStart(2,'0')">01 / 04</span><span>⌄</span></button></div><div class="top-tools"><button @click="save()">保存</button><button class="focus-toggle" @click="focus=!focus" :aria-pressed="focus" x-text="focus?'退出专注':'进入专注'">进入专注</button></div></header>
<section class="drawer" x-cloak x-show="library" x-transition.duration.180ms @click.outside="library=false"><div class="drawer-head">我的笔记 <small x-text="notes.length+' 篇'">4 篇</small></div><input aria-label="搜索笔记" placeholder="寻找一句话、一篇笔记" x-model="query"><template x-for="(n,i) in notes" :key="i"><button class="note" x-show="n.title.includes(query)" :class="{'selected':id===i}" @click="select(i);library=false"><span x-text="n.title"></span><small x-text="n.date"></small></button></template><p class="empty" x-show="!notes.some(n=>n.title.includes(query))">没有找到笔记</p><button class="add-note" @click="newNote();library=false">＋ 新建笔记</button></section>
<div class="scroll"><article class="sheet"><div class="eyebrow"><b x-text="note.group">随笔</b><span x-text="note.date+' · 草稿'">10 月 6 日 · 草稿</span></div><input class="title" aria-label="笔记标题" value="把日子，写慢一点" x-model="note.title" @input="status='已修改'"><div class="writing-line"></div><div class="source-wrap"><textarea class="source" aria-label="Markdown 正文" spellcheck="false" x-show="mode==='write'" x-model="note.body" @input="status='已修改'">午后的光落在桌面上，杯里的茶已经凉了。我关掉几个不停闪动的窗口，打开一张空白的纸。

有时候，写作不为抵达哪里。只是想把匆忙经过的日子，重新过一遍。

## 从一件小事开始

今天路过巷口的花店，店主正在给一枝快要开败的花换水。她没有急着把它丢掉，而是剪去枯掉的叶子，重新放回窗边。

我站了一会儿，忽然觉得，**留意也是一种照顾。**

&gt; 那些没有被记下来的瞬间，并不是没有发生。只是我们走得太快。</textarea><div class="preview" x-cloak x-show="mode==='preview'" x-html="render(note.body)"></div></div></article></div>
<footer class="dock"><div class="dock-left"><div class="mode-control"><span class="mode-slider" :style="'transform:translateX('+(mode==='preview'?58:0)+'px)'"></span><button :class="{'active':mode==='write'}" @click="mode='write'">写作</button><button :class="{'active':mode==='preview'}" @click="mode='preview'">预览</button></div><span x-text="count+' 字'">420 字</span></div><div class="dock-right"><div class="goal" title="每篇目标 1000 字"><span x-text="count+' / 1000'">420 / 1000</span><div class="goal-meter"><template x-for="i in 20"><i :class="{'lit':i<=count/50}"></i></template></div></div><span class="save-status" role="status" x-text="status">草稿</span></div></footer></main>
<script>
function escapeText(text){return String(text).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function inline(text){return escapeText(text).replace(/`([^`]+)`/g,'<code>$1</code>').replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>').replace(/\*([^*]+)\*/g,'<em>$1</em>');}
function renderMarkdown(text){return text.split(/\n\s*\n/).map(block=>{
 if(/^#{1,3}\s/.test(block)){const m=block.match(/^(#{1,3})\s+([\s\S]*)$/);return `<h${m[1].length}>${inline(m[2])}</h${m[1].length}>`;}
 if(/^>\s?/.test(block))return `<blockquote>${inline(block.replace(/^>\s?/gm,''))}</blockquote>`;
 if(block.split('\n').every(l=>/^[-*]\s+/.test(l)))return '<ul>'+block.split('\n').map(l=>'<li>'+inline(l.replace(/^[-*]\s+/,''))+'</li>').join('')+'</ul>';
 return '<p>'+inline(block).replace(/\n/g,'<br>')+'</p>';
 }).join('');}
function serializeEditor(el){
 const visit=n=>{if(n.nodeType===3)return n.textContent;if(n.nodeType!==1)return '';const inner=Array.from(n.childNodes).map(visit).join('');const tag=n.tagName;
 if(tag==='STRONG'||tag==='B')return '**'+inner+'**';if(tag==='EM'||tag==='I')return '*'+inner+'*';if(tag==='CODE')return '`'+inner+'`';if(tag==='BR')return '\n';
 if(/^H[1-3]$/.test(tag))return '#'.repeat(Number(tag[1]))+' '+inner+'\n\n';if(tag==='BLOCKQUOTE')return '> '+inner.trim()+'\n\n';if(tag==='LI')return '- '+inner+'\n';if(tag==='UL'||tag==='OL')return inner+'\n';if(tag==='P'||tag==='DIV')return inner+'\n\n';return inner;};
 return Array.from(el.childNodes).map(visit).join('').replace(/\n{3,}/g,'\n\n').trim();
}

document.addEventListener('alpine:init',()=>{ Alpine.data('soloWriter',()=>({notes:[{"title": "把日子，写慢一点", "group": "随笔", "date": "10 月 6 日", "body": "午后的光落在桌面上，杯里的茶已经凉了。我关掉几个不停闪动的窗口，打开一张空白的纸。\n\n有时候，写作不为抵达哪里。只是想把匆忙经过的日子，重新过一遍。\n\n## 从一件小事开始\n\n今天路过巷口的花店，店主正在给一枝快要开败的花换水。她没有急着把它丢掉，而是剪去枯掉的叶子，重新放回窗边。\n\n我站了一会儿，忽然觉得，**留意也是一种照顾。**\n\n> 那些没有被记下来的瞬间，并不是没有发生。只是我们走得太快。\n\n## 给念头留一点空白\n\n以前总想一口气写完一篇文章。现在学着停下来，给还没成形的念头留一个位置。不必急着解释，也不必立刻找到结尾。\n\n- 记下一个今天看到的细节\n- 写一句还没有答案的话\n- 允许这一页暂时没有结尾\n\n## 写给明天的自己\n\n如果明天再打开这篇笔记，希望还能记起今天的光，和那枝被留下来的花。"}, {"title": "雨停之后的街道", "group": "随笔", "date": "10 月 4 日", "body": "雨停之后，街道比下雨的时候更安静。路面留下了树的影子，偶尔有自行车从水洼旁边绕过。\n\n## 散步的理由\n\n我没有特别想去的地方，只是决定晚一点回家。沿着熟悉的路走，看到的却是一些平时没有留意的细节。\n\n> 同一条街道，每次走过都是不同的一天。\n\n## 留下来的声音\n\n屋檐上还在滴水。那声音很轻，但走远以后，我还是能听见。"}, {"title": "关于一间旧书店", "group": "随笔", "date": "9 月 28 日", "body": "书店在二楼，门口的木牌已经褪色。推开门时，铃铛响了一声。\n\n## 柜台后的人\n\n老板正在给一本旧书包封面，没有抬头。他说可以慢慢看，下午没有什么人。\n\n## 一页折角\n\n我翻开一本散文集，发现其中一页折了角。那一页写着海，我想象之前的读者，在某个下午读到了同样的句子。"}, {"title": "散步时想到的", "group": "灵感", "date": "9 月 25 日", "body": "## 尚未写成的句子\n\n- 一扇亮着灯的窗，像一句没有说完的话。\n- 走得慢的时候，路会变长，日子也是。\n- 一本书的最后一页，不一定是故事的结尾。"}],id:0,query:'',status:'草稿',focus:false,mode:'write',library:false,select(i){this.id=i;this.status='草稿';},init(){
  try{const saved=JSON.parse(localStorage.getItem("soloWriter-v1"));if(saved&&Array.isArray(saved.notes)&&saved.notes.length&&saved.notes.every(n=>typeof n.title==='string'&&typeof n.body==='string'&&typeof n.group==='string'&&typeof n.date==='string')){this.notes=saved.notes;this.id=Math.min(saved.id||0,this.notes.length-1);this.status='已保存';}}catch(e){this.status='恢复失败';}
  const state=new URLSearchParams(location.search).get('state');
  if(state==='focus')this.focus=true;
  if(state==='empty'){this.notes=[{title:'未命名笔记',body:'',group:'随笔',date:'10 月 6 日'}];this.id=0;this.status='草稿';}
  if(state==='source'&&'mode' in this)this.mode='source';
  if(state==='preview'){if('mode' in this)this.mode='preview';if('layout' in this)this.layout='preview';}
  if(state==='error')this.status='保存失败，请重试';
  if('layout' in this&&this.focus)this.layout='source';
  if(this.$refs.editor)this.$nextTick(()=>this.$refs.editor.innerHTML=renderMarkdown(this.note.body));
 },
 get note(){return this.notes[this.id];},
 get count(){return (this.note.title+this.note.body).replace(/[\s#>*`\-]/g,'').length;},
 render:renderMarkdown,
 save(){try{localStorage.setItem("soloWriter-v1",JSON.stringify({notes:this.notes,id:this.id}));this.status='已保存';}catch(e){this.status='保存失败，请重试';}},
 newNote(){this.notes.push({title:'未命名笔记',body:'',group:'随笔',date:'10 月 6 日'});this.select(this.notes.length-1);if('group' in this)this.group='全部';this.query='';if('mode' in this)this.mode='write';this.$nextTick(()=>document.querySelector('input[aria-label="笔记标题"]').focus());}
 })); });</script></body></html>
