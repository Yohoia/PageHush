/* 并排与单张之间、视口与筛选变化用页面过渡：同一方向的画面从卡片放大到单张，其他卡片淡出，侧栏从右侧滑入 */
::view-transition-group(*){animation-duration:var(--glide-d);animation-timing-function:var(--glide)}
::view-transition-old(*),::view-transition-new(*){height:100%;object-fit:cover;object-position:50% 0}
::view-transition-old(root),::view-transition-new(root){animation-duration:.2s}
::view-transition-old(*):only-child{animation:vt-out .18s var(--exit) both}
::view-transition-new(*):only-child{animation:vt-in .3s .08s ease-out both}
::view-transition-new(info):only-child{animation:info-in var(--glide-d) var(--glide) both}
::view-transition-old(info):only-child{animation:info-out .22s var(--exit) both}
::view-transition-old(bar){display:none}::view-transition-new(bar){animation:none}
/* 视口、筛选、说明开关和缩放只改变形状与位置：外框直接变形，内容不做叠影 */
html[data-vt=reshape]::view-transition-old(*){animation:none;opacity:0}
html[data-vt=reshape]::view-transition-new(*){animation:none}
html[data-vt=reshape]::view-transition-old(*):only-child{animation:vt-out .18s var(--exit) both;opacity:1}
html[data-vt=reshape]::view-transition-new(*):only-child{animation:vt-in .3s .08s ease-out both}

(--ink);font-family:var(--sans)}[x-cloak]{display:none!important}button,input,textarea{font:inherit;color:inherit}button{border:0;background:transparent;cursor:pointer;min-height:34px;border-radius:var(--radius);transition:background 180ms,transform 100ms,color 180ms}button:hover{background:var(--surface);color:#fff}button:active{transform:scale(.97)}button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:5px}::selection{background:#51465f}.app{height:100dvh;display:flex;flex-direction:column;position:relative}.mast{height:82px;flex-shrink:0;display:flex;justify-content:space-between;align-items:center;margin:0 48px;border-bottom:1px solid var(--line);font-size:12px;gap:24px}.wordmark{font-size:19px;font-weight:500;letter-spacing:6px;display:flex;align-items:center;gap:18px}.wordmark span{font:14px var(--mono);letter-spacing:-2px;color:var(--accent)}.top-tools{display:flex;align-items:center;gap:24px;color:var(--quiet)}.open-library{padding:0 5px;display:flex;gap:14px;align-items:center}.open-library span{font:12px var(--mono);color:var(--quiet)}.top-tools .focus-toggle{font-size:12px}.header-left{display:flex;gap:55px;align-items:center}.scroll{flex:1;overflow:auto;min-height:0}.sheet{max-width:var(--column);margin:75px auto 90px;position:relative;padding:0 24px;animation:ink-in 450ms var(--ease)}.eyebrow{display:flex;justify-content:space-between;align-items:center;color:var(--quiet);font:12px var(--mono);margin-bottom:28px}.eyebrow b{color:var(--accent);font-weight:400}.title{background:none;border:0;outline:none;width:100%;padding:0;font:500 32px/1.5 var(--mono);letter-spacing:0;margin-bottom:37px}.writing-line{height:1px;background:var(--line);margin-bottom:31px;width:40px}.source-wrap{position:relative}.gutter{position:absolute;right:calc(100% + 34px);top:0;font:11px/40px var(--mono);color:#6f6c7a;text-align:right}.source{width:100%;padding:0;resize:none;background:none;border:0;outline:none;font:18px/2.15 var(--mono);caret-color:var(--accent);min-height:870px}.preview{font:18px/2.15 var(--mono);min-height:700px}.preview p{margin:0 0 24px}.preview h2{color:var(--accent);font:500 20px/1.6 var(--mono);margin:36px 0 20px}.preview blockquote{margin:24px 0;color:var(--quiet);padding-left:22px}.preview ul{padding-left:23px}.dock{height:74px;flex-shrink:0;display:flex;justify-content:space-between;align-items:center;gap:20px;margin:0 48px;border-top:1px solid var(--line);font:11px var(--mono);color:var(--quiet)}.dock-left,.dock-right{display:flex;gap:24px;align-items:center}.mode-control{display:flex;background:#1c1b20;padding:3px;border-radius:6px;position:relative}.mode-control button{position:relative;z-index:1;padding:0 17px;min-height:30px;font:12px var(--sans);color:var(--quiet)}.mode-control button.active{color:var(--ink)}.mode-slider{position:absolute;top:3px;bottom:3px;left:3px;width:58px;background:#39343f;border-radius:4px;transition:transform 200ms var(--ease)}.goal{display:flex;align-items:center;gap:12px}.goal-meter{display:flex;gap:3px}.goal-meter i{width:3px;height:10px;background:var(--line);transition:background 200ms}.goal-meter i.lit{background:#a599ba}.save-status{color:var(--accent)}.focus .mast{border-color:transparent}.focus .header-left>.open-library,.focus .wordmark,.focus .dock-left>span,.focus .goal{opacity:0;pointer-events:none;transition:opacity 220ms}.focus .sheet{margin-top:65px}.drawer{position:absolute;top:71px;left:162px;width:340px;background:var(--surface);border:1px solid var(--line);z-index:20;box-shadow:0 12px 40px #0004;padding:20px;border-radius:6px;transform-origin:top left}.drawer-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:15px;font-size:13px}.drawer-head small{color:var(--quiet);font-size:11px}.drawer input{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:4px;padding:10px 12px;outline:none;margin-bottom:13px;font-size:13px}.drawer button.note{display:flex;justify-content:space-between;align-items:center;gap:12px;width:100%;padding:12px;text-align:left;font-size:13px}.note.selected{background:var(--selected);color:var(--accent)}.note small{font-size:11px;color:var(--quiet);white-space:nowrap}.drawer .add-note{width:100%;padding:12px;text-align:left;border-top:1px solid var(--line);margin-top:10px;color:var(--accent);font-size:12px}.empty{padding:14px;color:var(--quiet);font-size:13px}@keyframes ink-in{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}.tip{position:absolute;left:52px;bottom:105px;writing-mode:vertical-rl;letter-spacing:3px;color:#77717f;font:11px var(--sans);letter-spacing:3px}\n@media(max-width:1000px){.gutter{display:none}.tip{display:none}.sheet{max-width:660px}.header-left{gap:32px}}\n@media(max-width:650px){.mast{height:65px;margin:0 22px;gap:10px}.wordmark{font-size:17px;letter-spacing:3px;gap:8px}.wordmark span{display:none}.header-left{gap:12px}.top-tools{gap:7px}.top-tools button{min-height:44px;padding:0 6px}.open-library{min-height:44px;font-size:12px}.open-library span{display:none}.sheet{margin:42px auto 55px;padding:0 28px}.title{font-size:27px;margin-bottom:28px}.source{font-size:17px;line-height:2.05;min-height:1250px}.eyebrow{font-size:11px;margin-bottom:23px}.dock{margin:0 20px;height:72px;gap:8px}.dock-left{gap:12px}.dock-left>span{font-size:10px}.dock-right{gap:9px}.goal{display:none}.save-status{font-size:10px}.mode-control button{min-height:40px;padding:0 17px}.drawer{left:20px;right:20px;top:60px;width:auto}.drawer input{font-size:16px}.drawer button.note{min-height:48px}.focus .sheet{margin-top:42px}.preview{font-size:17px}}\n@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}\n\u003c/style>\u003c/head>\u003cbody>\n\u003cmain class=\"app\" x-data=\"soloWriter\" :class=\"{'focus':focus}\" @keydown.escape.window=\"library=false;focus=false\" @keydown.meta.s.window.prevent=\"save()\" @keydown.ctrl.s.window.prevent=\"save()\">\n\u003cheader class=\"mast\">\u003cdiv class=\"header-left\">\u003cdiv class=\"wordmark\">\u003cspan>[ ]\u003c/span>独页\u003c/div>\u003cbutton class=\"open-library\" @click=\"library=!library\" :aria-expanded=\"library\">我的笔记 \u003cspan x-text=\"String(id+1).padStart(2,'0')+' / '+String(notes.length).padStart(2,'0')\">01 / 04\u003c/span>\u003cspan>⌄\u003c/span>\u003c/button>\u003c/div>\u003cdiv class=\"top-tools\">\u003cbutton @click=\"save()\">保存\u003c/button>\u003cbutton class=\"focus-toggle\" @click=\"focus=!focus\" :aria-pressed=\"focus\" x-text=\"focus?'退出专注':'进入专注'\">进入专注\u003c/button>\u003c/div>\u003c/header>\n\u003csection class=\"drawer\" x-cloak x-show=\"library\" x-transition.duration.180ms @click.outside=\"library=false\">\u003cdiv class=\"drawer-head\">我的笔记 \u003csmall x-text=\"notes.length+' 篇'\">4 篇\u003c/small>\u003c/div>\u003cinput aria-label=\"搜索笔记\" placeholder=\"寻找一句话、一篇笔记\" x-model=\"query\">\u003ctemplate x-for=\"(n,i) in notes\" :key=\"i\">\u003cbutton class=\"note\" x-show=\"n.title.includes(query)\" :class=\"{'selected':id===i}\" @click=\"select(i);library=false\">\u003cspan x-text=\"n.title\">\u003c/span>\u003csmall x-text=\"n.date\">\u003c/small>\u003c/button>\u003c/template>\u003cp class=\"empty\" x-show=\"!notes.some(n=>n.title.includes(query))\">没有找到笔记\u003c/p>\u003cbutton class=\"add-note\" @click=\"newNote();library=false\">＋ 新建笔记\u003c/button>\u003c/section>\n\u003cdiv class=\"scroll\">\u003carticle class=\"sheet\">\u003cdiv class=\"eyebrow\">\u003cb x-text=\"note.group\">随笔\u003c/b>\u003cspan x-text=\"note.date+' · 草稿'\">10 月 6 日 · 草稿\u003c/span>\u003c/div>\u003cinput class=\"title\" aria-label=\"笔记标题\" value=\"把日子，写慢一点\" x-model=\"note.title\" @input=\"status='已修改'\">\u003cdiv class=\"writing-line\">\u003c/div>\u003cdiv class=\"source-wrap\">\u003ctextarea class=\"source\" aria-label=\"Markdown 正文\" spellcheck=\"false\" x-show=\"mode==='write'\" x-model=\"note.body\" @input=\"status='已修改'\">午后的光落在桌面上，杯里的茶已经凉了。我关掉几个不停闪动的窗口，打开一张空白的纸。\n\n有时候，写作不为抵达哪里。只是想把匆忙经过的日子，重新过一遍。\n\n## 从一件小事开始\n\n今天路过巷口的花店，店主正在给一枝快要开败的花换水。她没有急着把它丢掉，而是剪去枯掉的叶子，重新放回窗边。\n\n我站了一会儿，忽然觉得，**留意也是一种照顾。**\n\n&gt; 那些没有被记下来的瞬间，并不是没有发生。只是我们走得太快。\u003c/textarea>\u003cdiv class=\"preview\" x-cloak x-show=\"mode==='preview'\" x-html=\"render(note.body)\">\u003c/div>\u003c/div>\u003c/article>\u003c/div>\n\u003cfooter class=\"dock\">\u003cdiv class=\"dock-left\">\u003cdiv class=\"mode-control\">\u003cspan class=\"mode-slider\" :style=\"'transform:translateX('+(mode==='preview'?58:0)+'px)'\">\u003c/span>\u003cbutton :class=\"{'active':mode==='write'}\" @click=\"mode='write'\">写作\u003c/button>\u003cbutton :class=\"{'active':mode==='preview'}\" @click=\"mode='preview'\">预览\u003c/button>\u003c/div>\u003cspan x-text=\"count+' 字'\">420 字\u003c/span>\u003c/div>\u003cdiv class=\"dock-right\">\u003cdiv class=\"goal\" title=\"每篇目标 1000 字\">\u003cspan x-text=\"count+' / 1000'\">420 / 1000\u003c/span>\u003cdiv class=\"goal-meter\">\u003ctemplate x-for=\"i in 20\">\u003ci :class=\"{'lit':i\u003c=count/50}\">\u003c/i>\u003c/template>\u003c/div>\u003c/div>\u003cspan class=\"save-status\" role=\"status\" x-text=\"status\">草稿\u003c/span>\u003c/div>\u003c/footer>\u003c/main>\n\u003cscript>\nfunction escapeText(text){return String(text).replace(/[&\u003c>\"']/g,c=>({'&':'&amp;','\u003c':'&lt;','>':'&gt;','\"':'&quot;',\"'\":'&#39;'}[c]));}\nfunction inline(text){return escapeText(text).replace(/`([^`]+)`/g,'\u003ccode>$1\u003c/code>').replace(/\\*\\*([^*]+)\\*\\*/g,'\u003cstrong>$1\u003c/strong>').replace(/\\*([^*]+)\\*/g,'\u003cem>$1\u003c/em>');}\nfunction renderMarkdown(text){return text.split(/\\n\\s*\\n/).map(block=>{\n if(/^#{1,3}\\s/.test(block)){const m=block.match(/^(#{1,3})\\s+([\\s\\S]*)$/);return `\u003ch${m[1].length}>${inline(m[2])}\u003c/h${m[1].length}>`;}\n if(/^>\\s?/.test(block))return `\u003cblockquote>${inline(block.replace(/^>\\s?/gm,''))}\u003c/blockquote>`;\n if(block.split('\\n').every(l=>/^[-*]\\s+/.test(l)))return '\u003cul>'+block.split('\\n').map(l=>'\u003cli>'+inline(l.replace(/^[-*]\\s+/,''))+'\u003c/li>').join('')+'\u003c/ul>';\n return '\u003cp>'+inline(block).replace(/\\n/g,'\u003cbr>')+'\u003c/p>';\n }).join('');}\nfunction serializeEditor(el){\n const visit=n=>{if(n.nodeType===3)return n.textContent;if(n.nodeType!==1)return '';const inner=Array.from(n.childNodes).map(visit).join('');const tag=n.tagName;\n if(tag==='STRONG'||tag==='B')return '**'+inner+'**';if(tag==='EM'||tag==='I')return '*'+inner+'*';if(tag==='CODE')return '`'+inner+'`';if(tag==='BR')return '\\n';\n if(/^H[1-3]$/.test(tag))return '#'.repeat(Number(tag[1]))+' '+inner+'\\n\\n';if(tag==='BLOCKQUOTE')return '> '+inner.trim()+'\\n\\n';if(tag==='LI')return '- '+inner+'\\n';if(tag==='UL'||tag==='OL')return inner+'\\n';if(tag==='P'||tag==='DIV')return inner+'\\n\\n';return inner;};\n return Array.from(el.childNodes).map(visit).join('').replace(/\\n{3,}/g,'\\n\\n').trim();\n}\n\ndocument.addEventListener('alpine:init',()=>{ Alpine.data('soloWriter',()=>({notes:[{\"title\": \"把日子，写慢一点\", \"group\": \"随笔\", \"date\": \"10 月 6 日\", \"body\": \"午后的光落在桌面上，杯里的茶已经凉了。我关掉几个不停闪动的窗口，打开一张空白的纸。\\n\\n有时候，写作不为抵达哪里。只是想把匆忙经过的日子，重新过一遍。\\n\\n## 从一件小事开始\\n\\n今天路过巷口的花店，店主正在给一枝快要开败的花换水。她没有急着把它丢掉，而是剪去枯掉的叶子，重新放回窗边。\\n\\n我站了一会儿，忽然觉得，**留意也是一种照顾。**\\n\\n> 那些没有被记下来的瞬间，并不是没有发生。只是我们走得太快。\\n\\n## 给念头留一点空白\\n\\n以前总想一口气写完一篇文章。现在学着停下来，给还没成形的念头留一个位置。不必急着解释，也不必立刻找到结尾。\\n\\n- 记下一个今天看到的细节\\n- 写一句还没有答案的话\\n- 允许这一页暂时没有结尾\\n\\n## 写给明天的自己\\n\\n如果明天再打开这篇笔记，希望还能记起今天的光，和那枝被留下来的花。\"}, {\"title\": \"雨停之后的街道\", \"group\": \"随笔\", \"date\": \"10 月 4 日\", \"body\": \"雨停之后，街道比下雨的时候更安静。路面留下了树的影子，偶尔有自行车从水洼旁边绕过。\\n\\n## 散步的理由\\n\\n我没有特别想去的地方，只是决定晚一点回家。沿着熟悉的路走，看到的却是一些平时没有留意的细节。\\n\\n> 同一条街道，每次走过都是不同的一天。\\n\\n## 留下来的声音\\n\\n屋檐上还在滴水。那声音很轻，但走远以后，我还是能听见。\"}, {\"title\": \"关于一间旧书店\", \"group\": \"随笔\", \"date\": \"9 月 28 日\", \"body\": \"书店在二楼，门口的木牌已经褪色。推开门时，铃铛响了一声。\\n\\n## 柜台后的人\\n\\n老板正在给一本旧书包封面，没有抬头。他说可以慢慢看，下午没有什么人。\\n\\n## 一页折角\\n\\n我翻开一本散文集，发现其中一页折了角。那一页写着海，我想象之前的读者，在某个下午读到了同样的句子。\"}, {\"title\": \"散步时想到的\", \"group\": \"灵感\", \"date\": \"9 月 25 日\", \"body\": \"## 尚未写成的句子\\n\\n- 一扇亮着灯的窗，像一句没有说完的话。\\n- 走得慢的时候，路会变长，日子也是。\\n- 一本书的最后一页，不一定是故事的结尾。\"}],id:0,query:'',status:'草稿',focus:false,mode:'write',library:false,select(i){this.id=i;this.status='草稿';},init(){\n  try{const saved=JSON.parse(localStorage.getItem(\"soloWriter-v1\"));if(saved&&Array.isArray(saved.notes)&&saved.notes.length&&saved.notes.every(n=>typeof n.title==='string'&&typeof n.body==='string'&&typeof n.group==='string'&&typeof n.date==='string')){this.notes=saved.notes;this.id=Math.min(saved.id||0,this.notes.length-1);this.status='已保存';}}catch(e){this.status='恢复失败';}\n  const state=new URLSearchParams(location.search).get('state');\n  if(state==='focus')this.focus=true;\n  if(state==='empty'){this.notes=[{title:'未命名笔记',body:'',group:'随笔',date:'10 月 6 日'}];this.id=0;this.status='草稿';}\n  if(state==='source'&&'mode' in this)this.mode='source';\n  if(state==='preview'){if('mode' in this)this.mode='preview';if('layout' in this)this.layout='preview';}\n  if(state==='error')this.status='保存失败，请重试';\n  if('layout' in this&&this.focus)this.layout='source';\n  if(this.$refs.editor)this.$nextTick(()=>this.$refs.editor.innerHTML=renderMarkdown(this.note.body));\n },\n get note(){return this.notes[this.id];},\n get count(){return (this.note.title+this.note.body).replace(/[\\s#>*`\\-]/g,'').length;},\n render:renderMarkdown,\n save(){try{localStorage.setItem(\"soloWriter-v1\",JSON.stringify({notes:this.notes,id:this.id}));this.status='已保存';}catch(e){this.status='保存失败，请重试';}},\n newNote(){this.notes.push({title:'未命名笔记',body:'',group:'随笔',date:'10 月 6 日'});this.select(this.notes.length-1);if('group' in this)this.group='全部';this.query='';if('mode' in this)this.mode='write';this.$nextTick(()=>document.querySelector('input[aria-label=\"笔记标题\"]').focus());}\n })); });\u003c/script>\u003cscript>/*! Alpine.js 3.17.4 | MIT License | https://github.com/alpinejs/alpine */\n(()=>{var bt=!1,Et 稿\" placeholder=\"寻找一篇文稿\" x-model=\"query\">\u003cdiv class=\"notes\">\u003ctemplate x-for=\"(n,i) in notes\" :key=\"i\">\u003cbutton class=\"note\" x-show=\"n.title.includes(query)||n.body.includes(query)\" :class=\"{'selected':id===i}\" @click=\"select(i);closeLibrary()\">\u003cstrong x-text=\"n.title\">\u003c/strong>\u003csmall>\u003cspan x-text=\"n.group\">\u003c/span>\u003cspan x-text=\"n.date\">\u003c/span>\u003c/small>\u003c/button>\u003c/template>\u003cdiv class=\"empty-search\" x-show=\"!notes.some(n=>n.title.includes(query)||n.body.includes(query))\">没有找到“\u003cspan x-text=\"query\">\u003c/span>”\u003cbr>\u003cbutton @click=\"query='';$refs.search.focus()\">清除搜索\u003c/button>\u003c/div>\u003c/div>\u003cbutton class=\"new-note\" @click=\"newNote();closeLibrary(false)\">＋ 新建文稿\u003c/button>\u003c/section>\n\u003cdiv class=\"scroll\" x-ref=\"scroll\">\u003carticle class=\"sheet\">\u003cdiv class=\"folio\" x-text=\"String(id+1).padStart(2,'0')\">01\u003c/div>\u003cdiv class=\"doc-meta\">\u003cspan class=\"section\" x-text=\"note.group\">随笔\u003c/span>\u003cspan x-text=\"note.date\">10 月 6 日\u003c/span>\u003c/div>\u003cdiv class=\"title-wrap\">\u003cspan class=\"title-mark\" x-show=\"mode==='write'\" aria-hidden=\"true\">#\u003c/span>\u003ctextarea class=\"title\" rows=\"1\" aria-label=\"文稿标题\" x-ref=\"title\" x-model=\"note.title\" @input=\"sizeTitle($el);changed()\" @keydown.enter.prevent=\"focusEditor()\">把日子，写慢一点\u003c/textarea>\u003c/div>\u003cdiv class=\"rule\">\u003c/div>\n\u003cdiv class=\"source-wrap\" x-show=\"mode==='write'\">\u003ctextarea class=\"native-source\" x-ref=\"source\" aria-label=\"Markdown 正文\" spellcheck=\"false\">午后的光落在桌面上，杯里的茶已经凉了。我关掉几个不停闪动的窗口，打开一张空白的纸。\n\n有时候，写作不为抵达哪里。只是想把匆忙经过的日子，重新过一遍。\n\n## 从一件小事开始\n\n今天路过巷口的花店，店主正在给一枝快要开败的花换水。她没有急着把它丢掉，而是剪去枯掉的叶子，重新放回窗边。\n\n我站了一会儿，忽然觉得，**留意也是一种照顾。**\n\n> 那些没有被记下来的瞬间，并不是没有发生。只是我们走得太快。\u003c/textarea>\u003cdiv class=\"empty-hint\" x-cloak x-show=\"!note.body.length\">从一句话开始。\u003c/div>\u003c/div>\u003cdiv class=\"prose\" x-cloak x-show=\"mode==='preview'\" x-html=\"render(note.body)\">\u003c/div>\u003c/article>\u003c/div>\n\u003cfooter class=\"dock\">\u003cdiv class=\"dock-left\">\u003cdiv class=\"mode-control\" :inert=\"focus\">\u003cspan class=\"mode-line\" :style=\"'transform:translateX('+(mode==='preview'?48:0)+'px)'\" aria-hidden=\"true\">\u003c/span>\u003cbutton :class=\"{'active':mode==='write'}\" :aria-pressed=\"mode==='write'\" @click=\"changeMode('write')\">写作\u003c/button>\u003cbutton :class=\"{'active':mode==='preview'}\" :aria-pressed=\"mode==='preview'\" @click=\"changeMode('preview')\">预览\u003c/button>\u003c/div>\u003cspan class=\"md-format\">Markdown\u003c/span>\u003c/div>\u003cdiv class=\"dock-right\">\u003cspan x-text=\"count+' 字'\">323 字\u003c/span>\u003cspan class=\"reading-time\" x-text=\"'阅读约 '+Math.max(1,Math.ceil(count/400))+' 分钟'\">阅读约 1 分钟\u003c/span>\u003cspan class=\"save-status\" :class=\"{'error':status.includes('失败')}\" role=\"status\" x-text=\"status\">草稿\u003c/span>\u003cbutton class=\"retry\" x-cloak x-show=\"status.includes('保存失败')\" @click=\"save()\">重试\u003c/button>\u003c/div>\u003c/footer>\u003cdiv class=\"toast\" x-cloak x-show=\"toast\" x-transition.opacity.duration.150ms role=\"status\" x-text=\"toast\">\u003c/div>\n\u003c/main>\u003cscript>\nlet writingEditor, saveTimer, toastTimer, syncing=false, stored=false;\nconst INITIAL_NOTES=[{\"title\": \"把日子，写慢一点\", \"group\": \"随笔\", \"date\": \"10 月 6 日\", \"body\": \"午后的光落在桌面上，杯里的茶已经凉了。我关掉几个不停闪动的窗口，打开一张空白的纸。\\n\\n有时候，写作不为抵达哪里。只是想把匆忙经过的日子，重新过一遍。\\n\\n## 从一件小事开始\\n\\n今天路过巷口的花店，店主正在给一枝快要开败的花换水。她没有急着把它丢掉，而是剪去枯掉的叶子，重新放回窗边。\\n\\n我站了一会儿，忽然觉得，**留意也是一种照顾。**\\n\\n> 那些没有被记下来的瞬间，并不是没有发生。只是我们走得太快。\\n\\n## 给念头留一点空白\\n\\n以前总想一口气写完一篇文章。现在学着停下来，给还没成形的念头留一个位置。不必急着解释，也不必立刻找到结尾。\\n\\n- 记下一个今天看到的细节\\n- 写一句还没有答案的话\\n- 允许这一页暂时没有结尾\\n\\n## 写给明天的自己\\n\\n如果明天再打开这篇笔记，希望还能记起今天的光，和那枝被留下来的花。\"}, {\"title\": \"雨停之后的街道\", \"group\": \"随笔\", \"date\": \"10 月 4 日\", \"body\": \"雨停之后，街道比下雨的时候更安静。路面留下了树的影子，偶尔有自行车从水洼旁边绕过。\\n\\n## 散步的理由\\n\\n我没有特别想去的地方，只是决定晚一点回家。沿着熟悉的路走，看到的却是一些平时没有留意的细节。\\n\\n> 同一条街道，每次走过都是不同的一天。\\n\\n## 留下来的声音\\n\\n屋檐上还在滴水。那声音很轻，但走远以后，我还是能听见。\"}, {\"title\": \"关于一间旧书店\", \"group\": \"随笔\", \"date\": \"9 月 28 日\", \"body\": \"书店在二楼，门口的木牌已经褪色。推开门时，铃铛响了一声。\\n\\n## 柜台后的人\\n\\n老板正在给一本旧书包封面，没有抬头。他说可以慢慢看，下午没有什么人。\\n\\n## 一页折角\\n\\n我翻开一本散文集，发现其中一页折了角。那一页写着海，我想象之前的读者，在某个下午读到了同样的句子。\"}, {\"title\": \"散步时想到的\", \"group\": \"灵感\", \"date\": \"9 月 25 日\", \"body\": \"## 尚未写成的句子\\n\\n- 一扇亮着灯的窗，像一句没有说完的话。\\n- 走得慢的时候，路会变长，日子也是。\\n- 一本书的最后一页，不一定是故事的结尾。\"}];\nconst STORAGE='pagehush-writer-v2';\ndocument.addEventListener('alpine:init',()=>Alpine.data('pageHushWriter',()=>({\n notes:JSON.parse(JSON.stringify(INITIAL_NOTES)),id:0,mode:'write',focus:false,library:false,query:'',status:'草稿',toast:'',\n init(){\n  try{const raw=localStorage.getItem(STORAGE)||localStorage.getItem('soloWriter-v1');const saved=raw&&JSON.parse(raw);\n   if(saved&&Array.isArray(saved.notes)&&saved.notes.length&&saved.notes.every(n=>n&&typeof n.title==='string'&&typeof n.body==='string'&&typeof n.group==='string'&&typeof n.date==='string')){this.notes=saved.notes;this.id=Math.max(0,Math.min(Number(saved.id)||0,saved.notes.length-1));this.status='已保存';stored=true;}\n  }catch(e){this.status='恢复失败，草稿已保留';}\n  const state=new URLSearchParams(location.search).get('state');\n  if(state==='focus')this.focus=true;\n  if(state==='preview')this.mode='preview';\n  if(state==='empty'){this.notes=[{title:'未命名文稿',body:'',group:'随笔',date:'10 月 6 日'}];this.id=0;this.status='草稿';stored=false;}\n  if(state==='long-title')this.notes[0].title='把日子写慢一点，也给那些没有说出口的话留一个位置';\n  if(state==='error')this.status='保存失败，草稿已保留';\n  this.$nextTick(()=>{this.mountEditor();this.sizeTitle(this.$refs.title);if(state==='library')this.openLibrary();});\n  window.addEventListener('resize',()=>this.sizeTitle(this.$refs.title));\n  window.addEventListener('pagehide',()=>{if(saveTimer)this.save();});\n },\n get note(){return this.notes[this. .$refs.scroll.scrollTop=this.note.scroll||0;});\n },\n changeMode(m){\n  const s=this.$refs.scroll;const ratio=s.scrollTop/Math.max(1,s.scrollHeight-s.clientHeight);this.mode=m;\n  this.$nextTick(()=>{if(m==='write')writingEditor.refresh();s.scrollTop=ratio*Math.max(0,s.scrollHeight-s.clientHeight);});\n },\n openLibrary(){if(this.library){this.closeLibrary();return;}this.library=true;this.$nextTick(()=>this.$refs.search.focus());},\n closeLibrary(restore=true){if(!this.library)return;this.library=false;if(restore)this.$nextTick(()=>this.$refs.libraryButton.focus());},\n trapFocus(event){const elements=Array.from(event.currentTarget.querySelectorAll('button,input')).filter(el=>el.getClientRects().length);const first=elements[0],last=elements[elements.length-1];if(event.shiftKey&&document.activeElement===first){event.preventDefault();last.focus();}else if(!event.shiftKey&&document.activeElement===last){event.preventDefault();first.focus();}},\n newNote(){if(saveTimer)this.save();this.notes.push({title:'未命名文稿',body:'',group:'随笔',date:'10 月 6 日'});this.select(this.notes.length-1);this.query='';this.mode='write';this.changed();this.$nextTick(()=>{writingEditor.refresh();this.$refs.title.focus();this.$refs.title.select();});},\n wrap(mark){const selected=writingEditor.getSelection();writingEditor.replaceSelection(mark+selected+mark,'around');if(!selected){const p=writingEditor.getCursor('from');writingEditor.setCursor({line:p.line,ch:p.ch+mark.length});}writingEditor.focus();},\n render(body){return DOMPurify.sanitize(marked.parse(body,{gfm:true,breaks:false}),{FORBID_TAGS:['style','iframe','object','embed'],FORBID_ATTR:['style']});},\n exportNote(){const blob=new Blob(['# '+this.note.title+'\\n\\n'+this.note.body+'\\n'],{type:'text/markdown;charset=utf-8'});const url=URL.createObjectURL(blob);const link=document.createElement('a');link.href=url;link.download=(this.note.title.trim()||'未命名文稿').replace(/[\\\\/:*?\"\u003c>|]/g,'-')+'.md';link.style.display='none';document.b   if(box.classList.contains('slide')){const cs=getComputedStyle(box),w=box.clientWidth-parseFloat(cs.paddingLeft)-parseFloat(cs.paddingRight),h=narrow()?Infinity:box.clientHeight-parseFloat(cs.paddingTop)-parseFloat(cs.paddingBottom);r=box.dataset.zoom==='actual'?1:Math.min(w/size.w,h/size.h,1);}
  else r=Math.min(box.clientWidth/size.w,1);
  if(!(r>0))return;
  s.style.width=`${size.w*r}px`;s.style.height=`${size.h*r}px`;m.style.width=`${size.w}px`;m.style.height=`${size.h}px`;m.style.transform=`scale(${r})`;
 }
 const fitAll=()=>$$('.stage').forEach(fit),refit=()=>requestAnimationFrame(fitAll);

 function specList(c){
  const dl=el('dl','spec');const row=(k,v)=>{dl.append(el('dt',null,k),el('dd',null,v));};
  row('字体',c.typography);row('特征',(c.traits||[]).join(' · '));return dl;
 }
 function pickButton(c){const b=el('button','pick');b.type='button';b.dataset.pick=c.id;b.addEventListener('click',()=>choose(c.id));return b;}
 function card(c,i){
  const a=el('article','card');a.dataset.id=c.id;a.style.setProperty('--i',i);a.setAttribute('aria-label',c.name);
  const frame=el('div','frame');frame.style.viewTransitionName=vtName(c);const s=stage(c,false);
  const hit=el('button','hit');hit.type='button';hit.setAttribute('aria-label',`单张查看 ${c.name}`);hit.addEventListener('click',()=>setLayout('loupe',c.id));
  s.append(hit);frame.append(s,el('span','pick-mark','已选择'),el('span','peek','点击单张查看 · 实际尺寸'));
  const cap=el('div','cap');cap.style.viewTransitionName=`cap-${C.indexOf(c)}`;cap.append(el('span',c.baseline?'no base':'no',no(c)),el('h2','name',c.name),stripMini(c),pickButton(c));
  const lede=el('p','lede',c.concept);lede.title=c.concept;lede.style.viewTransitionName=`lede-${C.indexOf(c)}`;
  a.append(frame,cap,lede);return a;
 }
 function syncCompare(){
  const list=shown(),g=$('#grid'),key=list.map(c=>c.id).join();
  if(key!==gridKey){gridKey=key;g.replaceChildren(...list.map(card));}
  g.dataset.notes=st.notesOn?'on':'off';g.style.setProperty('--cols',Math.min(Math.max(list.length,1),st.viewport==='mobile'?4:3));
  $$('.card .frame').forEach(f=>f.dataset.viewport=st.viewport);
 }

 // 单张查看：所有方向预先排成一条横向轨道，切换时整条轨道滑动，不重新加载画面
 function syncLoupe(dir){
  const list=shown(),key=list.map(c=>c.id).join();if(!list.length)return;
  if(key!==loupeKey){
   loupeKey=key;dir=0;
   $('#track').replaceChildren(...list.map(c=>{const sl=el('div','slide');sl.dataset.id=c.id;sl.append(stage(c,true));return sl;}));
   $('#film').replaceChildren(el('span','film-ind'),...list.map(c=>{const b=el('button');b.type='button';b.dataset.id=c.id;b.append(el('span','fn',no(c)),el('span','ft',c.name),stripMini(c));b.addEventListener('click',()=>go(c.id));return b;}));
  }
  if(!list.some(c=>c.id===st.current))st.current=list[0].id;
  const i=list.findIndex(c=>c.id===st.current),track=$('#track');
  if(!dir)track.style.transition='none';
  track.style.transform=`translateX(${-i*100}%)`;
  if(!dir){track.offsetWidth;track.style.transition='';}
  $$('.slide').forEach(sl=>{const on=sl.dataset.id===st.current;sl.classList.toggle('is-current',on);sl.inert=!on;sl.dataset.zoom=on&&zoomActual?'actual':'fit';sl.firstElementChild.style.viewTransitionName=on?vtName(byId[sl.dataset.id]):'none';});
  $('#prev').disabled=i<=0;$('#next').disabled=i>=list.length-1;
  $$('#film button').forEach(b=>b.setAttribute('aria-current',String(b.dataset.id===st.current)));
  renderInfo(dir);placeFilm(!dir);
  const cur=$('#film [aria-current=true]'),f=$('#film');
  if(cur&&f.scrollWidth>f.clientWidth)f.scrollTo({left:cur.offsetLeft-16,behavior:calm.matches||!dir?'auto':'smooth'});
 }
 function renderInfo(dir){
  const c=byId[st.current],body=$('#info-body');
  const sw=el('div','big-sw');(c.palette||[]).forEach(h=>{const d=el('div');const x=el('i');x.style.background=h;d.append(x,h.toUpperCase());sw.append(d);});
  const tools=el('div','tools');const z=el('button','tool',zoomActual?'适应窗口':'实际尺寸 100%');z.id='zoom';z.type='button';z.setAttribute('aria-pressed',String(zoomActual));z.addEventListener('click',toggleZoom);tools.append(z);
  const hint=el('p','hint');hint.innerHTML='<kbd>←</kbd> <kbd>→</kbd> 切换方向　<kbd>P</kbd> 选择并复制<br><kbd>Esc</kbd> 回到并排';
  const blocks=[el('span','idx',no(c)),el('h2','name',c.name)];
  if(st.notesOn)blocks.push(el('p','north',c.concept),sw,specList(c));
  blocks.push(pickButton(c),tools,hint,el('p','src',c.kind==='image'?`静态图：${c.sourceLabel}。缩放不代表响应式重排。`:c.kind==='url'?`实时运行 ${c.sourceLabel}。空白时确认开发服务器已启动，且允许被嵌入。`:c.interactive?`单张查看时可以直接操作 ${c.sourceLabel}；无法联网，也不保留浏览器存储。`:`预览禁用脚本与提交；交互请直接打开 ${c.sourceLabel}。`));
  body.replaceChildren(...blocks);paintChoice();
  if(dir)animate(body,[{opacity:0,transform:`translateX(${dir*18}px)`},{opacity:1,transform:'none'}],{duration:420,easing:ease('glide')});
 }
 function toggleZoom(){
  morph(()=>{zoomActual=!zoomActual;const sl=$('.slide.is-current');sl.dataset.zoom=zoomActual?'actual':'fit';fitAll();sl.scrollTo(0,0);const z=$('#zoom');z.textContent=zoomActual?'适应窗口':'实际尺寸 100%';z.setAttribute('aria-pressed',String(zoomActual));},'reshape');
 }

 function render(){
  const list=shown(),loupe=st.layout==='loupe'&&list.length>0;
  $('#compare-view').hidden=st.layout!=='compare'||!list.length;$('#loupe').hidden=!loupe;$('#none').hidden=list.length>0;
  syncCompare();syncLoupe(0);
  $$('[data-layout]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.layout===st.layout)));
  $$('[data-viewport]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.viewport===st.viewport)));
  placeThumbs(false);placeFilm(true);
  $('#notes-toggle').checked=st.notesOn;
  $('#filter-summary').textContent=`比较范围 ${list.length}/${C.length}`;
  $$('#filter-list input').forEach(i=>i.checked=st.visible.includes(i.value));
  paintChoice();fitAll();
 }
 function setLayout(layout,id){
  if(layout===st.layout&&!(id&&id!==st.current))return;
  if(layout==='loupe'&&st.layout==='compare')compareScroll=scrollY;
  if(id)st.current=id;st.layout=layout;zoomActual=false;save();
  morph(()=>{
   render();
   if(layout==='loupe'){window.scrollTo(0,0);return;}
   window.scrollTo(0,compareScroll);
   const a=$(`.card[data-id="${CSS.escape(st.current)}"]`),r=a?.getBoundingClientRect();
   if(r&&(r.top<60||r.bottom>innerHeight))a.scrollIntoView({block:'center'});
  });
 }
 function go(id){
  const list=shown(),from=list.findIndex(c=>c.id===st.current),to=list.findIndex(c=>c.id===id);
  if(to<0||to===from)return;
  st.current=id;zoomActual=false;save();syncLoupe(Math.sign(to-from));fitAll();
 }
 function step(d){const list=shown(),i=list.findIndex(c=>c.id===st.current),n=list[i+d];if(n)go(n.id);else nudge(d);}
 function nudge(d){animate($('.slide.is-current .stage'),[{transform:'none'},{transform:`translateX(${d*14}px)`},{transform:'none'}],{duration:320,easing:'ease-out'});}

 // 选择即复制：再次点击“已选择”会带上最新备注重新复制，不再有单独的复制按钮
 function choose(id){
  const fresh=st.chosen!==id;st.chosen=id;save();paintChoice();
  if(fresh){
   animate($(`.card[data-id="${CSS.escape(id)}"] .pick-mark`),[{opacity:0,transform:'scale(.4)'},{opacity:1,transform:'scale(1)'}],{duration:500,easing:ease('pop')});
   animate($('#decide-name'),[{opacity:0,transform:'translateY(10px)'},{opacity:1,transform:'none'}],{duration:380,easing:ease('glide')});
   animate($('#choice-chip'),[{transform:'scale(.3)'},{transform:'scale(1)'}],{duration:500,easing:ease('pop')});
  }
  copy();
 }
 function paintChoice(){
  $$('.card').forEach(a=>a.classList.toggle('is-chosen',a.dataset.id===st.chosen));
  $$('[data-pick]').forEach(b=>{const on=b.dataset.pick===st.chosen,short=!!b.closest('.cap');b.replaceChildren(document.createTextNode(on?(short?'已选择':'已选择 · 复制'):(short?'选择':'选这个方向')));if(!short)b.append(el('kbd',null,'P'));b.toggleAttribute('data-on',on);b.title=on?'再点一次，带上最新备注重新复制':'选择这个方向，并复制给 Agent';});
  $$('#film button').forEach(b=>b.querySelector('.ft').classList.toggle('chosen',b.dataset.id===st.chosen));
  const c=byId[st.chosen];$('#decide-name').textContent=c?`${no(c)} ${c.name}`:'未选择方向';$('#picked').classList.toggle('on',!!c);
  const chip=$('#choice-chip'),next=c?stripMini(c):el('span','choice-empty');next.id='choice-chip';chip.replaceWith(next);
  status();
 }
 function status(){$('#notes-open').textContent=st.notes?'备注 ·':'备注';const s=$('#state');if(!stored){s.textContent='浏览器存储不可用：关闭页面后选择和备注不会保留。';s.dataset.warn='';}else{s.textContent='备注会和选择一起复制。改完备注，再点一次“已选择”重新复制。';delete s.dataset.warn;}}
 function copyText(){const c=byId[st.chosen];let t=`${DATA.round?DATA.round+'：':''}选 ${no(c)} ${c.name}`;if(st.notes.trim())t+=`\n备注：${st.notes.trim()}`;return t;}
 async function copy(t=copyText()){
  let ok=false;
  try{await navigator.clipboard.writeText(t);ok=true;}catch{const a=el('textarea');a.value=t;a.setAttribute('readonly','');a.style.cssText='position:fixed;opacity:0';document.body.append(a);a.select();try{ok=document.execCommand('copy');}catch{}a.remove();}
  toast(ok,t);
 }
 function toast(ok,t){
  const n=$('#toast');n.toggleAttribute('data-fail',!ok);n.querySelector('b').textContent=ok?'已复制，粘贴给 Agent':'复制失败，请手动复制';n.querySelector('code').textContent=ok?t.replace(/\n/g,' · '):t;
  n.classList.remove('show');n.offsetWidth;n.classList.add('show');
  clearTimeout(toastTimer);toastTimer=setTimeout(()=>n.classList.remove('show'),ok?2400:8000);
 }

 const fl=$('#filter-list');
 C.forEach(c=>{const l=el('label'),i=el('input');i.type='checkbox';i.value=c.id;i.addEventListener('change',()=>{st.visible=C.map(x=>x.id).filter(id=>id===c.id?i.checked:st.visible.includes(id));save();morph(render,'reshape');});l.append(i,el('span','n',no(c)),c.name);fl.append(l);});
 $('#show-all').addEventListener('click',()=>{st.visible=C.map(c=>c.id);save();morph(render,'reshape');});
 $$('button[data-layout]').forEach(b=>b.addEventListener('click',()=>setLayout(b.dataset.layout)));
 $$('button[data-viewport]').forEach(b=>b.addEventListener('click',()=>{if(st.viewport===b.dataset.viewport)return;st.viewport=b.dataset.viewport;save();morph(render,'reshape');}));
 $('#notes-toggle').addEventListener('change',e=>{st.notesOn=e.target.checked;save();morph(render,'reshape');});
 $('#prev').addEventListener('click',()=>step(-1));$('#next').addEventListener('click',()=>step(1));
 document.addEventListener('keydown',e=>{
  if(e.target.closest?.('textarea,input,summary')||e.metaKey||e.ctrlKey||e.altKey||st.layout!=='loupe')return;
  if(e.key==='ArrowLeft')step(-1);else if(e.key==='ArrowRight')step(1);else if(e.key==='Escape')setLayout('compare');else if(e.key.toLowerCase()==='p')choose(st.current);
 });
 const notes=$('#notes');notes.value=st.notes||'';
 notes.addEventListener('input',()=>{st.notes=notes.value;save();status();});
 $('#notes-open').parentElement.addEventListener('toggle',e=>{if(e.target.open)notes.focus();});
 function syncBars(){root.style.setProperty('--bar-h',`${$('#bar').offsetHeight}px`);placeThumbs(true);placeFilm(true);refit();}
 window.addEventListener('resize',syncBars,{passive:true});
 document.fonts?.ready.then(()=>{placeThumbs(true);placeFilm(true);});
 $('#bar').hidden=false;
 if(st.layout==='compare'){$('#grid').classList.add('first');$('.intro').classList.add('first');setTimeout(()=>{$('#grid').classList.remove('first');$('.intro').classList.remove('first');},1400);}
 render();syncBars();
 if(services.size){checkServices();setInterval(()=>{if(!document.hidden)checkServices();},5000);window.addEventListener('focus',checkServices);document.addEventListener('visibilitychange',()=>{if(!document.hidden)checkServices();});}
})();
</script></body></html>
