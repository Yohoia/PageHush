/* 并排与单张之间、视口与筛选变化用页面过渡：同一方向的画面从卡片放大到单张，其他卡片淡出，侧栏从右侧滑入 */
::view-transition-group(*){animation-duration:var(--glide-d);animation-timing-function:var(--glide)}
::view-transition-old(*),::view-transition-new(*){height:100%;object-fit:cover;object-position:50% 0}
::view-transition-old(root),::view-transition-new(root){animation-duration:.2s}
::view-transition-old(*):only-child{animation:vt-out .18s var(--exit) both}
::view-transition-new(*):only-child{animation:vt-in .3s .08s ease-out both}
::view-transition-new(info):only-child{animation:info-in var(--glide-d) var(--glide) both}
::view-transition-old(info):only-child{animation:info-out .22s var(--exit) both}
::view-transition-old(bar){display:none}::view-transition-new(bar){animation:none}
/* 视口、筛选、说明开关和缩放只改变形状与位置：外框直接变形，内容不做叠影 */
html[data-vt=reshape]::view-transition-old(*){animation:none;opacity:0}
html[data-vt=reshape]::view-transition-new(*){animation:none}
html[data-vt=reshape]::view-transition-old(*):only-child{animation:vt-out .18s var(--exit) both;opacity:1}
html[data-vt=reshape]::view-transition-new(*):only-child{animation:vt-in .3s .08s ease-out both}

ter=\"draft\">草稿\u003c/button>\u003cbutton data-filter=\"modified\">有修改\u003c/button>\u003cbutton data-filter=\"published\">已发布\u003c/button>\u003cbutton data-filter=\"trash\">回收站\u003c/button>\u003c/div>\u003c/div>\n\u003csection class=\"list\" aria-label=\"文稿列表\">\n\u003ca class=\"row\" data-status=\"modified\" data-text=\"把日子写慢一点 随笔\">\u003cspan class=\"number\">01\u003c/span>\u003cdiv class=\"main\">\u003ch2 class=\"title\">把日子，写慢一点\u003c/h2>\u003cp class=\"excerpt\">关掉几个不停闪动的窗口，重新看见桌面上的一杯茶、一段光，和一张还没有写满的纸。\u003c/p>\u003cdiv class=\"meta\">\u003cspan>#写作\u003c/span>\u003ci>\u003c/i>\u003cspan>10 月 6 日\u003c/span>\u003ci>\u003c/i>\u003cspan>482 字\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"topic\">随笔\u003cspan>Essay\u003c/span>\u003c/div>\u003cspan class=\"status\">有修改\u003c/span>\u003c/a>\n\u003ca class=\"row\" data-status=\"published\" data-text=\"雨停之后的街道 随笔\">\u003cspan class=\"number\">02\u003c/span>\u003cdiv class=\"main\">\u003ch2 class=\"title\">雨停之后的街道\u003c/h2>\u003cp class=\"excerpt\">雨停之后，街道比下雨的时候更安静。路面留下了树的影子，偶尔有自行车从水洼旁边绕过。\u003c/p>\u003cdiv class=\"meta\">\u003cspan>#散步\u003c/span>\u003ci>\u003c/i>\u003cspan>10 月 4 日\u003c/span>\u003ci>\u003c/i>\u003cspan>318 字\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"topic\">随笔\u003cspan>Essay\u003c/span>\u003c/div>\u003cspan class=\"status\">已发布\u003c/span>\u003c/a>\n\u003ca class=\"row\" data-status=\"draft\" data-text=\"PageHush 编辑器边界 思考\">\u003cspan class=\"number\">03\u003c/span>\u003cdiv class=\"main\">\u003ch2 class=\"title\">编辑器的边界\u003c/h2>\u003cp class=\"excerpt\">可视化编辑不应该吞掉 Markdown / MDX 源文本。工具要帮助作者看见结构，而不是替作者决定内容。\u003c/p>\u003cdiv class=\"meta\">\u003cspan>#工具\u003c/span>\u003ci>\u003c/i>\u003cspan>10 月 5 日\u003c/span>\u003ci>\u003c/i>\u003cspan>906 字\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"topic\">思考\u003cspan>Notes\u003c/span>\u003c/div>\u003cspan class=\"status\">草稿\u003c/span>\u003c/a>\n\u003ca class=\"row\" data-status=\"published\" data-text=\"旧书店 散文\">\u003cspan class=\"number\">04\u003c/span>\u003cdiv class=\"main\">\u003ch2 class=\"title\">关于一间旧书店\u003c/h2>\u003cp class=\"excerpt\">书店在二楼，门口的木牌已经褪色。推开门时，铃铛响了一声，时间也慢了半拍。\u003c/p>\u003cdiv class=\"meta\">\u003cspan>#书店\u003c/span>\u003ci>\u003c/i>\u003cspan>9 月 28 日\u003c/span>\u003ci>\u003c/i>\u003cspan>524 字\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"topic\">散文\u003cspan>Prose\u003c/span>\u003c/div>\u003cspan class=\"status\">已发布\u003c/span>\u003c/a>\n\u003ca class=\"row\" data-status=\"draft\" data-text=\"Astro 发布链路 技术\">\u003cspan class=\"number\">05\u003c/span>\u003cdiv class=\"main\">\u003ch2 class=\"title\">一次安静的发布\u003c/h2>\u003cp class=\"excerpt\">发布不是把文件复制到服务器，而是把一篇文章、一组资源和一次可回滚的站点版本固定下来。\u003c/p>\u003cdiv class=\"meta\">\u003cspan>#发布\u003c/span>\u003ci>\u003c/i>\u003cspan>10 月 3 日\u003c/span>\u003ci>\u003c/i>\u003cspan>734 字\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"topic\">技术\u003cspan>Tech\u003c/span>\u003c/div>\u003cspan class=\"status\">草稿\u003c/span>\u003c/a>\n\u003ca class=\"row\" data-status=\"modified\" data-text=\"清晨六点 随笔\">\u003cspan class=\"number\">06\u003c/span>\u003cdiv class=\"main\">\u003ch2 class=\"title\">清晨六点\u003c/h2>\u003cp class=\"excerpt\">天亮得很慢，楼下有人拉开卷帘门，声音短促而清楚。我在窗边写下第一句。\u003c/p>\u003cdiv class=\"meta\">\u003cspan>#清晨\u003c/span>\u003ci>\u003c/i>\u003cspan>9 月 22 日\u003c/span>\u003ci>\u003c/i>\u003cspan>236 字\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"topic\">随笔\u003cspan>Essay\u003c/span>\u003c/div>\u003cspan class=\"status\">有修改\u003c/span>\u003c/a>\n\u003ca class=\"row\" data-status=\"published\" data-text=\"KNN 笔记 技术\">\u003cspan class=\"number\">07\u003c/span>\u003cdiv class=\"main\">\u003ch2 class=\"title\">KNN 学习笔记\u003c/h2>\u003cp class=\"excerpt\">从一组距离、一个 K 值和一次归一化开始，重新理解最朴素的近邻思想。\u003c/p>\u003cdiv class=\"meta\">\u003cspan>#机器学习\u003c/span>\u003ci>\u003c/i>\u003cspan>9 月 18 日\u003c/span>\u003ci>\u003c/i>\u003cspan>1284 字\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"topic\">技术\u003cspan>Tech\u003c/span>\u003c/div>\u003cspan class=\"status\">已发布\u003c/span>\u003c/a>\n\u003ca class=\"row\" data-status=\"draft\" data-text=\"给未来的信 书信\">\u003cspan class=\"number\">08\u003c/span>\u003cdiv class=\"main\">\u003ch2 class=\"title\">给未来的一封信\u003c/h2>\u003cp class=\"excerpt\">这封信不急着抵达。它只是把今天的犹豫、好奇和一点确定，放在同一个抽屉里。\u003c/p>\u003cdiv class=\"meta\">\u003cspan>#未来\u003c/span>\u003ci>\u003c/i>\u003cspan>10 月 1 日\u003c/span>\u003ci>\u003c/i>\u003cspan>392 字\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"topic\">书信\u003cspan>Letter\u003c/span>\u003c/div>\u003cspan class=\"status\">草稿\u003c/span>\u003c/a>\n\u003cdiv class=\"empty\">没有找到对应文稿，试试更换关键词或状态。\u003c/div>\n\u003c/section>\n\u003c/main>\n\u003c/div>\n\u003cscript>\nconst rows=[...document.querySelectorAll('.row')];const empty=document.querySelector('.empty');let filter='all',query='';\ndocument.querySelectorAll('.filters button').forEach(button=>button.addEventListener('click',()=>{document.querySelector('.filters .active')?.classList.remove('active');button.classList.add('active');filter=button.dataset.filter;render()}));\ndocument.querySelector('.search input').addEventListener('input',event=>{query=event.target.value.trim().toLowerCase();render()});\nfunction render(){let visible=0;rows.forEach((row,index)=>{const match=(filter==='all'||row.dataset.status===filter)&&(!query||row.dataset.text.toLowerCase().includes(query));row.style.display=match?'grid':'none';if(match){visible++;row.style.animation='none';requestAnimationFrame(()=>{row.style.animation='';row.style.animationDelay=(index*35)+'ms'})}});empty.classList.toggle('show',visible===0)}\n\u003c/script>\n\u003c/body>\n\u003c/html>\n", "sourceLabel": "quiet-index.html", "baseline": false, "interactive": true}, {"id": "editorial-catalogue", "name": "页息刊物", "concept": "把文稿库视作一本连续刊物，左侧固定刊物说明，右侧篇目编号清晰。", "typography": "62px Medium 大标题、29px 篇目标题、小型英文标签。", "palette": ["#f4efe4", "#1d1d18", "#a94d38"], "traits": ["双栏刊物结构", "编号与页边状态", "悬停展开页边红线", "品牌仪式感最强"], "kind": "html", " t\">把所有文章当作一本连续刊物的篇目来翻阅：标题先出场，状态与日期留在页边。\u003c/p>\u003cdiv class=\"summary\">\u003cdl>\u003cdt>总计\u003c/dt>\u003cdd>8 篇\u003c/dd>\u003cdt>草稿\u003c/dt>\u003cdd>3 篇\u003c/dd>\u003cdt>有修改\u003c/dt>\u003cdd>2 篇\u003c/dd>\u003cdt>已发布\u003c/dt>\u003cdd>3 篇\u003c/dd>\u003c/dl>\u003c/div>\u003cbutton class=\"new\">＋ 新建文稿\u003c/button>\u003c/aside>\n\u003csection class=\"right\">\u003cdiv class=\"tools\">\u003cdiv class=\"segment\" aria-label=\"状态筛选\">\u003cbutton class=\"active\" data-filter=\"all\">全部\u003c/button>\u003cbutton data-filter=\"draft\">草稿\u003c/button>\u003cbutton data-filter=\"modified\">修改\u003c/button>\u003cbutton data-filter=\"published\">已发布\u003c/button>\u003c/div>\u003clabel class=\"search\">\u003cspan aria-hidden=\"true\">⌕\u003c/span>\u003cinput placeholder=\"搜索篇目\" aria-label=\"搜索篇目\">\u003c/label>\u003c/div>\n\u003cdiv class=\"entry\" data-status=\"modified\" data-text=\"把日子写慢一点\">\u003cspan class=\"no\">NO. 01\u003c/span>\u003carticle>\u003ch2>把日子，写慢一点\u003c/h2>\u003cp class=\"excerpt\">关掉几个不停闪动的窗口，重新看见桌面上的一杯茶、一段光，和一张还没有写满的纸。\u003c/p>\u003cdiv class=\"meta\">\u003cspan>随笔\u003c/span>\u003cspan>#写作\u003c/span>\u003cspan>482 字\u003c/span>\u003c/div>\u003c/article>\u003cdiv class=\"side\">10 月 6 日\u003cstrong>有修改*\u003c/strong>\u003c/div>\u003c/div>\n\u003cdiv class=\"entry\" data-status=\"published\" data-text=\"雨停之后的街道\">\u003cspan class=\"no\">NO. 02\u003c/span>\u003carticle>\u003ch2>雨停之后的街道\u003c/h2>\u003cp class=\"excerpt\">雨停之后，街道比下雨的时候更安静。路面留下了树的影子，偶尔有自行车从水洼旁边绕过。\u003c/p>\u003cdiv class=\"meta\">\u003cspan>随笔\u003c/span>\u003cspan>#散步\u003c/span>\u003cspan>318 字\u003c/span>\u003c/div>\u003c/article>\u003cdiv class=\"side\">10 月 4 日\u003cstrong>已发布\u003c/strong>\u003c/div>\u003c/div>\n\u003cdiv class=\"entry\" data-status=\"draft\" data-text=\"编辑器的边界\">\u003cspan class=\"no\">NO. 03\u003c/span>\u003carticle>\u003ch2>编辑器的边界\u003c/h2>\u003cp class=\"excerpt\">可视化编辑不应该吞掉 Markdown / MDX 源文本。工具要帮助作者看见结构，而不是替作者决定内容。\u003c/p>\u003cdiv class=\"meta\">\u003cspan>思考\u003c/span>\u003cspan>#工具\u003c/span>\u003cspan>906 字\u003c/span>\u003c/div>\u003c/article>\u003cdiv class=\"side\">10 月 5 日\u003cstrong>草稿\u003c/strong>\u003c/div>\u003c/div>\n\u003cdiv class=\"entry\" data-status=\"published\" data-text=\"关于一间旧书店\">\u003cspan class=\"no\">NO. 04\u003c/span>\u003carticle>\u003ch2>关于一间旧书店\u003c/h2>\u003cp class=\"excerpt\">书店在二楼，门口的木牌已经褪色。推开门时，铃铛响了一声，时间也慢了半拍。\u003c/p>\u003cdiv class=\"meta\">\u003cspan>散文\u003c/span>\u003cspan>#书店\u003c/span>\u003cspan>524 字\u003c/span>\u003c/div>\u003c/article>\u003cdiv class=\"side\">9 月 28 日\u003cstrong>已发布\u003c/strong>\u003c/div>\u003c/div>\n\u003cdiv class=\"entry\" data-status=\"draft\" data-text=\"一次安静的发布\">\u003cspan class=\"no\">NO. 05\u003c/span>\u003carticle>\u003ch2>一次安静的发布\u003c/h2>\u003cp class=\"excerpt\">发布不是把文件复制到服务器，而是把一篇文章、一组资源和一次可回滚的站点版本固定下来。\u003c/p>\u003cdiv class=\"meta\">\u003cspan>技术\u003c/span>\u003cspan>#发布\u003c/span>\u003cspan>734 字\u003c/span>\u003c/div>\u003c/article>\u003cdiv class=\"side\">10 月 3 日\u003cstrong>草稿\u003c/strong>\u003c/div>\u003c/div>\n\u003cdiv class=\"entry\" data-status=\"modified\" data-text=\"清晨六点\">\u003cspan class=\"no\">NO. 06\u003c/span>\u003carticle>\u003ch2>清晨六点\u003c/h2>\u003cp class=\"excerpt\">天亮得很慢，楼下有人拉开卷帘门，声音短促而清楚。我在窗边写下第一句。\u003c/p>\u003cdiv class=\"meta\">\u003cspan>随笔\u003c/span>\u003cspan>#清晨\u003c/span>\u003cspan>236 字\u003c/span>\u003c/div>\u003c/article>\u003cdiv class=\"side\">9 月 22 日\u003cstrong>有修改*\u003c/strong>\u003c/div>\u003c/div>\n\u003cdiv class=\"entry\" data-status=\"published\" data-text=\"KNN 学习笔记\">\u003cspan class=\"no\">NO. 07\u003c/span>\u003carticle>\u003ch2>KNN 学习笔记\u003c/h2>\u003cp class=\"excerpt\">从一组距离、一个 K 值和一次归一化开始，重新理解最朴素的近邻思想。\u003c/p>\u003cdiv class=\"meta\">\u003cspan>技术\u003c/span>\u003cspan>#机器学习\u003c/span>\u003cspan>1284 字\u003c/span>\u003c/div>\u003c/article>\u003cdiv class=\"side\">9 月 18 日\u003cstrong>已发布\u003c/strong>\u003c/div>\u003c/div>\n\u003cdiv class=\"entry\" data-status=\"draft\" data-text=\"给未来的一封信\">\u003cspan class=\"no\">NO. 08\u003c/span>\u003carticle>\u003ch2>给未来的一封信\u003c/h2>\u003cp class=\"excerpt\">这封信不急着抵达。它只是把今天的犹豫、好奇和一点确定，放在同一个抽屉里。\u003c/p>\u003cdiv class=\"meta\">\u003cspan>书信\u003c/span>\u003cspan>#未来\u003c/span>\u003cspan>392 字\u003c/span>\u003c/div>\u003c/article>\u003cdiv class=\"side\">10 月 1 日\u003cstrong>草稿\u003c/strong>\u003c/div>\u003c/div>\n\u003cdiv class=\"empty\">没有找到对应文稿，试试更换关键词或状态。\u003c/div>\u003c/section>\u003c/main>\u003c/div>\n\u003cscript>const entries=[...document.querySelectorAll('.entry')],empty=document.querySelector('.empty');let state='all',q='';document.querySelectorAll('.segment button').forEach(b=>b.onclick=()=>{document.querySelector('.segment .active')?.classList.remove('active');b.classList.add('active');state=b.dataset.filter;render()});document.querySelector('.search input').oninput=e=>{q=e.target.value.trim().toLowerCase();render()};function render(){let n=0;entries.forEach((entry,index)=>{const ok=(state==='all'||entry.dataset.status===state)&&(!q||entry.dataset.text.includes(q));entry.style.display=ok?'grid':'none';if(ok){n++;entry.style.animation='none';requestAnimationFrame(()=>{entry.style.animation='';entry.style.animationDelay=(index*35)+'ms'})}});empty.classList.toggle('show',n===0)}\u003c/script>\u003c/body>\u003c/html>\n", "sourceLabel": "editorial-catalogue.html", "baseline": false, "interactive": true}, {"id": "typographic-shelf", "name": "字卡书架", "concept": "用每篇文章的首字或关键词生成轻量字卡，让库房更可视但不使用照片。", "typography": "卡片标题 23px；字卡大字 54px；元信息 11–13px。", "palette": ["#f7f8f6", "#20221d", "#6c8767"], "traits": ["响应式卡片网格", "首字视觉记忆", "悬停上浮", "适合按标题浏览"], "kind": "html", "content": "\u003c!doctype html>\u003chtml lang=\"zh-CN\">\u003chead>\u003cmeta http-equiv=\"Content-Security-Policy\" content=\"default-src 'none'; style-src 'unsafe-inline'; img-src data:; font-src data:; media-src data:; script-src 'unsafe-inline' 'unsafe-eval'; form-action 'none'; base-uri 'none'; object-src 'none'\">\u0 \u003c/div>\u003csection class=\"grid\">\u003carticle class=\"card\" data-status=\"modified\" data-text=\"把日子写慢一点 写作\">\u003cdiv class=\"cover\">\u003cspan class=\"glyph\">慢\u003c/span>\u003cspan class=\"mark\">01\u003c/span>\u003c/div>\u003ch2>把日子，写慢一点\u003c/h2>\u003cp class=\"excerpt\">关掉不停闪动的窗口，重新看见一杯茶、一段光和一张没有写满的纸。\u003c/p>\u003cdiv class=\"bottom\">\u003cspan class=\"tagline\">\u003cspan>随笔\u003c/span>\u003cspan>#写作\u003c/span>\u003c/span>\u003cspan class=\"status\">有修改\u003c/span>\u003c/div>\u003c/article>\u003carticle class=\"card\" data-status=\"published\" data-text=\"雨停之后的街道 散步\">\u003cdiv class=\"cover\">\u003cspan class=\"glyph\">雨\u003c/span>\u003cspan class=\"mark\">02\u003c/span>\u003c/div>\u003ch2>雨停之后的街道\u003c/h2>\u003cp class=\"excerpt\">街道比下雨时更安静，路面留下树的影子。\u003c/p>\u003cdiv class=\"bottom\">\u003cspan class=\"tagline\">\u003cspan>随笔\u003c/span>\u003cspan>#散步\u003c/span>\u003c/span>\u003cspan class=\"status\">已发布\u003c/span>\u003c/div>\u003c/article>\u003carticle class=\"card\" data-status=\"draft\" data-text=\"编辑器的边界 工具\">\u003cdiv class=\"cover\">\u003cspan class=\"glyph\">器\u003c/span>\u003cspan class=\"mark\">03\u003c/span>\u003c/div>\u003ch2>编辑器的边界\u003c/h2>\u003cp class=\"excerpt\">可视化编辑不能吞掉 Markdown / MDX 源文本。\u003c/p>\u003cdiv class=\"bottom\">\u003cspan class=\"tagline\">\u003cspan>思考\u003c/span>\u003cspan>#工具\u003c/span>\u003c/span>\u003cspan class=\"status\">草稿\u003c/span>\u003c/div>\u003c/article>\u003carticle class=\"card\" data-status=\"published\" data-text=\"关于一间旧书店 书店\">\u003cdiv class=\"cover\">\u003cspan class=\"glyph\">书\u003c/span>\u003cspan class=\"mark\">04\u003c/span>\u003c/div>\u003ch2>关于一间旧书店\u003c/h2>\u003cp class=\"excerpt\">推开门时，铃铛响了一声，时间也慢了半拍。\u003c/p>\u003cdiv class=\"bottom\">\u003cspan class=\"tagline\">\u003cspan>散文\u003c/span>\u003cspan>#书店\u003c/span>\u003c/span>\u003cspan class=\"status\">已发布\u003c/span>\u003c/div>\u003c/article>\u003carticle class=\"card\" data-status=\"draft\" data-text=\"一次安静的发布 发布\">\u003cdiv class=\"cover\">\u003cspan class=\"glyph\">发\u003c/span>\u003cspan class=\"mark\">05\u003c/span>\u003c/div>\u003ch2>一次安静的发布\u003c/h2>\u003cp class=\"excerpt\">把文章、资源和一次可回滚的站点版本固定下来。\u003c/p>\u003cdiv class=\"bottom\">\u003cspan class=\"tagline\">\u003cspan>技术\u003c/span>\u003cspan>#发布\u003c/span>\u003c/span>\u003cspan class=\"status\">草稿\u003c/span>\u003c/div>\u003c/article>\u003carticle class=\"card\" data-status=\"modified\" data-text=\"清晨六点 清晨\">\u003cdiv class=\"cover\">\u003cspan class=\"glyph\">晨\u003c/span>\u003cspan class=\"mark\">06\u003c/span>\u003c/div>\u003ch2>清晨六点\u003c/h2>\u003cp class=\"excerpt\">楼下有人拉开卷帘门，我在窗边写下第一句。\u003c/p>\u003cdiv class=\"bottom\">\u003cspan class=\"tagline\">\u003cspan>随笔\u003c/span>\u003cspan>#清晨\u003c/span>\u003c/span>\u003cspan class=\"status\">有修改\u003c/span>\u003c/div>\u003c/article>\u003carticle class=\"card\" data-status=\"published\" data-text=\"KNN 学习笔记 机器学习\">\u003cdiv class=\"cover\">\u003cspan class=\"glyph\">K\u003c/span>\u003cspan class=\"mark\">07\u003c/span>\u003c/div>\u003ch2>KNN 学习笔记\u003c/h2>\u003cp class=\"excerpt\">从距离、K 值和归一化重新理解近邻思想。\u003c/p>\u003cdiv class=\"bottom\">\u003cspan class=\"tagline\">\u003cspan>技术\u003c/span>\u003cspan>#机器学习\u003c/span>\u003c/span>\u003cspan class=\"status\">已发布\u003c/span>\u003c/div>\u003c/article>\u003carticle class=\"card\" data-status=\"draft\" data-text=\"给未来的一封信 未来\">\u003cdiv class=\"cover\">\u003cspan class=\"glyph\">信\u003c/span>\u003cspan class=\"mark\">08\u003c/span>\u003c/div>\u003ch2>给未来的一封信\u003c/h2>\u003cp class=\"excerpt\">把今天的犹豫、好奇和一点确定放在同一个抽屉里。\u003c/p>\u003cdiv class=\"bottom\">\u003cspan class=\"tagline\">\u003cspan>书信\u003c/span>\u003cspan>#未来\u003c/span>\u003c/span>\u003cspan class=\"status\">草稿\u003c/span>\u003c/div>\u003c/article>\u003cdiv class=\"empty\">没有找到对应文稿，试试更换关键词或状态。\u003c/div>\u003c/section>\u003c/main>\u003c/div>\u003cscript>const cards=[...document.querySelectorAll('.card')],empty=document.querySelector('.empty');let filter='all',query='';d \u003c/button>\u003cbutton>设置\u003c/button>\u003c/nav>\u003c/header>\u003cmain>\u003cdiv class=\"head\">\u003cdiv>\u003ch1>时间归档\u003c/h1>\u003c/div>\u003cdiv class=\"summary\">\u003cbutton class=\"active\" data-filter=\"all\">全部\u003c/button>\u003cbutton data-filter=\"draft\">草稿\u003c/button>\u003cbutton data-filter=\"modified\">有修改\u003c/button>\u003cbutton data-filter=\"published\">已发布\u003c/button>\u003c/div>\u003c/div>\u003csection class=\"timeline\">\u003cdiv class=\"month\" data-month=\"october\">\u003ch2>OCTOBER 2026\u003c/h2>\u003carticle class=\"item\" data-status=\"modified\">\u003cdiv>\u003ch3>把日子，写慢一点\u003c/h3>\u003cp>关掉不停闪动的窗口，重新看见一杯茶、一段光和一张没有写满的纸。\u003c/p>\u003cdiv class=\"meta\">\u003cspan>随笔\u003c/span>\u003cspan>#写作\u003c/span>\u003cspan>482 字\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"right\">10 月 6 日\u003cstrong>有修改\u003c/strong>\u003c/div>\u003c/article>\u003carticle class=\"item\" data-status=\"published\">\u003cdiv>\u003ch3>雨停之后的街道\u003c/h3>\u003cp>雨停之后，街道比下雨的时候更安静。路面留下了树的影子。\u003c/p>\u003cdiv class=\"meta\">\u003cspan>随笔\u003c/span>\u003cspan>#散步\u003c/span>\u003cspan>318 字\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"right\">10 月 4 日\u003cstrong>已发布\u003c/strong>\u003c/div>\u003c/article>\u003carticle class=\"item\" data-status=\"draft\">\u003cdiv>\u003ch3>编辑器的边界\u003c/h3>\u003cp>可视化编辑不应该吞掉 Markdown / MDX 源文本。\u003c/p>\u003cdiv class=\"meta\">\u003cspan>思考\u003c/span>\u003cspan>#工具\u003c/span>\u003cspan>906 字\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"right\">10 月 5 日\u003cstrong>草稿\u003c/strong>\u003c/div>\u003c/article>\u003carticle class=\"item\" data-status=\"draft\">\u003cdiv>\u003ch3>一次安静的发布\u003c/h3>\u003cp>把文章、资源和一次可回滚的站点版本固定下来。\u003c/p>\u003cdiv class=\"meta\">\u003cspan>技术\u003c/span>\u003cspan>#发布\u003c/span>\u003cspan>734 字\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"right\">10 月 3 日\u003cstrong>草稿\u003c/strong>\u003c/div>\u003c/article>\u003carticle class=\"item\" data-status=\"draft\">\u003cdiv>\u003ch3>给未来的一封信\u003c/h3>\u003cp>把今天的犹豫、好奇和一点确定放在同一个抽屉里。\u003c/p>\u003cdiv class=\"meta\">\u003cspan>书信\u003c/span>\u003cspan>#未来\u003c/span>\u003cspan>392 字\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"right\">10 月 1 日\u003cstrong>草稿\u003c/strong>\u003c/div>\u003c/article>\u003c/div>\u003cdiv class=\"month\" data-month=\"september\">\u003ch2>SEPTEMBER 2026\u003c/h2>\u003carticle class=\"item\" data-status=\"published\">\u003cdiv>\u003ch3>关于一间旧书店\u003c/h3>\u003cp>推开门时，铃铛响了一声，时间也慢了半拍。\u003c/p>\u003cdiv class=\"meta\">\u003cspan>散文\u003c/span>\u003cspan>#书店\u003c/span>\u003cspan>524 字\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"right\">9 月 28 日\u003cstrong>已发布\u003c/strong>\u003c/div>\u003c/article>\u003carticle class=\"item\" data-status=\"modified\">\u003cdiv>\u003ch3>清晨六点\u003c/h3>\u003cp>楼下有人拉开卷帘门，我在窗边写下第一句。\u003c/p>\u003cdiv class=\"meta\">\u003cspan>随笔\u003c/span>\u003cspan>#清晨\u003c/span>\u003cspan>236 字\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"right\">9 月 22 日\u003cstrong>有修改\u003c/strong>\u003c/div>\u003c/article>\u003carticle class=\"item\" data-status=\"published\">\u003cdiv>\u003ch3>KNN 学习笔记\u003c/h3>\u003cp>从距离、K 值和归一化重新理解近邻思想。\u003c/p>\u003cdiv class=\"meta\">\u003cspan>技术\u003c/span>\u003cspan>#机器学习\u003c/span>\u003cspan>1284 字\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"right\">9 月 18 日\u003cstrong>已发布\u003c/strong>\u003c/div>\u003c/article>\u003c/div>\u003cdiv class=\"empty\">当前筛选下没有文稿。\u003c/div>\u003c/section>\u003c/main>\u003c/div>\u003cscript>const months=[...document.querySelectorAll('.month')],items=[...document.querySelectorAll('.item')],empty=document.querySelector('.empty');document.querySelectorAll('.summary button').forEach(button=>button.onclick=()=>{document.querySelector('.summary .active')?.classList.remove('active');button.classList.add('active');const filter=button.dataset.filter;let visible=0;items.forEach((item,index)=>{const match=filter==='all'||item.dataset.status===filter;item.style.display=match?'grid'   const cap=el('div','cap');cap.style.viewTransitionName=`cap-${C.indexOf(c)}`;cap.append(el('span',c.baseline?'no base':'no',no(c)),el('h2','name',c.name),stripMini(c),pickButton(c));
  const lede=el('p','lede',c.concept);lede.title=c.concept;lede.style.viewTransitionName=`lede-${C.indexOf(c)}`;
  a.append(frame,cap,lede);return a;
 }
 function syncCompare(){
  const list=shown(),g=$('#grid'),key=list.map(c=>c.id).join();
  if(key!==gridKey){gridKey=key;g.replaceChildren(...list.map(card));}
  g.dataset.notes=st.notesOn?'on':'off';g.style.setProperty('--cols',Math.min(Math.max(list.length,1),st.viewport==='mobile'?4:3));
  $$('.card .frame').forEach(f=>f.dataset.viewport=st.viewport);
 }

 // 单张查看：所有方向预先排成一条横向轨道，切换时整条轨道滑动，不重新加载画面
 function syncLoupe(dir){
  const list=shown(),key=list.map(c=>c.id).join();if(!list.length)return;
  if(key!==loupeKey){
   loupeKey=key;dir=0;
   $('#track').replaceChildren(...list.map(c=>{const sl=el('div','slide');sl.dataset.id=c.id;sl.append(stage(c,true));return sl;}));
   $('#film').replaceChildren(el('span','film-ind'),...list.map(c=>{const b=el('button');b.type='button';b.dataset.id=c.id;b.append(el('span','fn',no(c)),el('span','ft',c.name),stripMini(c));b.addEventListener('click',()=>go(c.id));return b;}));
  }
  if(!list.some(c=>c.id===st.current))st.current=list[0].id;
  const i=list.findIndex(c=>c.id===st.current),track=$('#track');
  if(!dir)track.style.transition='none';
  track.style.transform=`translateX(${-i*100}%)`;
  if(!dir){track.offsetWidth;track.style.transition='';}
  $$('.slide').forEach(sl=>{const on=sl.dataset.id===st.current;sl.classList.toggle('is-current',on);sl.inert=!on;sl.dataset.zoom=on&&zoomActual?'actual':'fit';sl.firstElementChild.style.viewTransitionName=on?vtName(byId[sl.dataset.id]):'none';});
  $('#prev').disabled=i<=0;$('#next').disabled=i>=list.length-1;
  $$('#film button').forEach(b=>b.setAttribute('aria-current',String(b.dataset.id===st.current)));
  renderInfo(dir);placeFilm(!dir);
  const cur=$('#film [aria-current=true]'),f=$('#film');
  if(cur&&f.scrollWidth>f.clientWidth)f.scrollTo({left:cur.offsetLeft-16,behavior:calm.matches||!dir?'auto':'smooth'});
 }
 function renderInfo(dir){
  const c=byId[st.current],body=$('#info-body');
  const sw=el('div','big-sw');(c.palette||[]).forEach(h=>{const d=el('div');const x=el('i');x.style.background=h;d.append(x,h.toUpperCase());sw.append(d);});
  const tools=el('div','tools');const z=el('button','tool',zoomActual?'适应窗口':'实际尺寸 100%');z.id='zoom';z.type='button';z.setAttribute('aria-pressed',String(zoomActual));z.addEventListener('click',toggleZoom);tools.append(z);
  const hint=el('p','hint');hint.innerHTML='<kbd>←</kbd> <kbd>→</kbd> 切换方向　<kbd>P</kbd> 选择并复制<br><kbd>Esc</kbd> 回到并排';
  const blocks=[el('span','idx',no(c)),el('h2','name',c.name)];
  if(st.notesOn)blocks.push(el('p','north',c.concept),sw,specList(c));
  blocks.push(pickButton(c),tools,hint,el('p','src',c.kind==='image'?`静态图：${c.sourceLabel}。缩放不代表响应式重排。`:c.kind==='url'?`实时运行 ${c.sourceLabel}。空白时确认开发服务器已启动，且允许被嵌入。`:c.interactive?`单张查看时可以直接操作 ${c.sourceLabel}；无法联网，也不保留浏览器存储。`:`预览禁用脚本与提交；交互请直接打开 ${c.sourceLabel}。`));
  body.replaceChildren(...blocks);paintChoice();
  if(dir)animate(body,[{opacity:0,transform:`translateX(${dir*18}px)`},{opacity:1,transform:'none'}],{duration:420,easing:ease('glide')});
 }
 function toggleZoom(){
  morph(()=>{zoomActual=!zoomActual;const sl=$('.slide.is-current');sl.dataset.zoom=zoomActual?'actual':'fit';fitAll();sl.scrollTo(0,0);const z=$('#zoom');z.textContent=zoomActual?'适应窗口':'实际尺寸 100%';z.setAttribute('aria-pressed',String(zoomActual));},'reshape');
 }

 function render(){
  const list=shown(),loupe=st.layout==='loupe'&&list.length>0;
  $('#compare-view').hidden=st.layout!=='compare'||!list.length;$('#loupe').hidden=!loupe;$('#none').hidden=list.length>0;
  syncCompare();syncLoupe(0);
  $$('[data-layout]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.layout===st.layout)));
  $$('[data-viewport]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.viewport===st.viewport)));
  placeThumbs(false);placeFilm(true);
  $('#notes-toggle').checked=st.notesOn;
  $('#filter-summary').textContent=`比较范围 ${list.length}/${C.length}`;
  $$('#filter-list input').forEach(i=>i.checked=st.visible.includes(i.value));
  paintChoice();fitAll();
 }
 function setLayout(layout,id){
  if(layout===st.layout&&!(id&&id!==st.current))return;
  if(layout==='loupe'&&st.layout==='compare')compareScroll=scrollY;
  if(id)st.current=id;st.layout=layout;zoomActual=false;save();
  morph(()=>{
   render();
   if(layout==='loupe'){window.scrollTo(0,0);return;}
   window.scrollTo(0,compareScroll);
   const a=$(`.card[data-id="${CSS.escape(st.current)}"]`),r=a?.getBoundingClientRect();
   if(r&&(r.top<60||r.bottom>innerHeight))a.scrollIntoView({block:'center'});
  });
 }
 function go(id){
  const list=shown(),from=list.findIndex(c=>c.id===st.current),to=list.findIndex(c=>c.id===id);
  if(to<0||to===from)return;
  st.current=id;zoomActual=false;save();syncLoupe(Math.sign(to-from));fitAll();
 }
 function step(d){const list=shown(),i=list.findIndex(c=>c.id===st.current),n=list[i+d];if(n)go(n.id);else nudge(d);}
 function nudge(d){animate($('.slide.is-current .stage'),[{transform:'none'},{transform:`translateX(${d*14}px)`},{transform:'none'}],{duration:320,easing:'ease-out'});}

 // 选择即复制：再次点击“已选择”会带上最新备注重新复制，不再有单独的复制按钮
 function choose(id){
  const fresh=st.chosen!==id;st.chosen=id;save();paintChoice();
  if(fresh){
   animate($(`.card[data-id="${CSS.escape(id)}"] .pick-mark`),[{opacity:0,transform:'scale(.4)'},{opacity:1,transform:'scale(1)'}],{duration:500,easing:ease('pop')});
   animate($('#decide-name'),[{opacity:0,transform:'translateY(10px)'},{opacity:1,transform:'none'}],{duration:380,easing:ease('glide')});
   animate($('#choice-chip'),[{transform:'scale(.3)'},{transform:'scale(1)'}],{duration:500,easing:ease('pop')});
  }
  copy();
 }
 function paintChoice(){
  $$('.card').forEach(a=>a.classList.toggle('is-chosen',a.dataset.id===st.chosen));
  $$('[data-pick]').forEach(b=>{const on=b.dataset.pick===st.chosen,short=!!b.closest('.cap');b.replaceChildren(document.createTextNode(on?(short?'已选择':'已选择 · 复制'):(short?'选择':'选这个方向')));if(!short)b.append(el('kbd',null,'P'));b.toggleAttribute('data-on',on);b.title=on?'再点一次，带上最新备注重新复制':'选择这个方向，并复制给 Agent';});
  $$('#film button').forEach(b=>b.querySelector('.ft').classList.toggle('chosen',b.dataset.id===st.chosen));
  const c=byId[st.chosen];$('#decide-name').textContent=c?`${no(c)} ${c.name}`:'未选择方向';$('#picked').classList.toggle('on',!!c);
  const chip=$('#choice-chip'),next=c?stripMini(c):el('span','choice-empty');next.id='choice-chip';chip.replaceWith(next);
  status();
 }
 function status(){$('#notes-open').textContent=st.notes?'备注 ·':'备注';const s=$('#state');if(!stored){s.textContent='浏览器存储不可用：关闭页面后选择和备注不会保留。';s.dataset.warn='';}else{s.textContent='备注会和选择一起复制。改完备注，再点一次“已选择”重新复制。';delete s.dataset.warn;}}
 function copyText(){const c=byId[st.chosen];let t=`${DATA.round?DATA.round+'：':''}选 ${no(c)} ${c.name}`;if(st.notes.trim())t+=`\n备注：${st.notes.trim()}`;return t;}
 async function copy(t=copyText()){
  let ok=false;
  try{await navigator.clipboard.writeText(t);ok=true;}catch{const a=el('textarea');a.value=t;a.setAttribute('readonly','');a.style.cssText='position:fixed;opacity:0';document.body.append(a);a.select();try{ok=document.execCommand('copy');}catch{}a.remove();}
  toast(ok,t);
 }
 function toast(ok,t){
  const n=$('#toast');n.toggleAttribute('data-fail',!ok);n.querySelector('b').textContent=ok?'已复制，粘贴给 Agent':'复制失败，请手动复制';n.querySelector('code').textContent=ok?t.replace(/\n/g,' · '):t;
  n.classList.remove('show');n.offsetWidth;n.classList.add('show');
  clearTimeout(toastTimer);toastTimer=setTimeout(()=>n.classList.remove('show'),ok?2400:8000);
 }

 const fl=$('#filter-list');
 C.forEach(c=>{const l=el('label'),i=el('input');i.type='checkbox';i.value=c.id;i.addEventListener('change',()=>{st.visible=C.map(x=>x.id).filter(id=>id===c.id?i.checked:st.visible.includes(id));save();morph(render,'reshape');});l.append(i,el('span','n',no(c)),c.name);fl.append(l);});
 $('#show-all').addEventListener('click',()=>{st.visible=C.map(c=>c.id);save();morph(render,'reshape');});
 $$('button[data-layout]').forEach(b=>b.addEventListener('click',()=>setLayout(b.dataset.layout)));
 $$('button[data-viewport]').forEach(b=>b.addEventListener('click',()=>{if(st.viewport===b.dataset.viewport)return;st.viewport=b.dataset.viewport;save();morph(render,'reshape');}));
 $('#notes-toggle').addEventListener('change',e=>{st.notesOn=e.target.checked;save();morph(render,'reshape');});
 $('#prev').addEventListener('click',()=>step(-1));$('#next').addEventListener('click',()=>step(1));
 document.addEventListener('keydown',e=>{
  if(e.target.closest?.('textarea,input,summary')||e.metaKey||e.ctrlKey||e.altKey||st.layout!=='loupe')return;
  if(e.key==='ArrowLeft')step(-1);else if(e.key==='ArrowRight')step(1);else if(e.key==='Escape')setLayout('compare');else if(e.key.toLowerCase()==='p')choose(st.current);
 });
 const notes=$('#notes');notes.value=st.notes||'';
 notes.addEventListener('input',()=>{st.notes=notes.value;save();status();});
 $('#notes-open').parentElement.addEventListener('toggle',e=>{if(e.target.open)notes.focus();});
 function syncBars(){root.style.setProperty('--bar-h',`${$('#bar').offsetHeight}px`);placeThumbs(true);placeFilm(true);refit();}
 window.addEventListener('resize',syncBars,{passive:true});
 document.fonts?.ready.then(()=>{placeThumbs(true);placeFilm(true);});
 $('#bar').hidden=false;
 if(st.layout==='compare'){$('#grid').classList.add('first');$('.intro').classList.add('first');setTimeout(()=>{$('#grid').classList.remove('first');$('.intro').classList.remove('first');},1400);}
 render();syncBars();
 if(services.size){checkServices();setInterval(()=>{if(!document.hidden)checkServices();},5000);window.addEventListener('focus',checkServices);document.addEventListener('visibilitychange',()=>{if(!document.hidden)checkServices();});}
})();
</script></body></html>
